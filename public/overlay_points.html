<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Points</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root { --c1: #fe2c55; --c2: #ff8a00; }
        html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; }
        #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        .card { width: min(460px, 92vw); padding: 20px 22px; border-radius: 24px; background: rgba(12, 12, 20, .82); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.15); box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 0 2px color-mix(in srgb, var(--c1) 45%, transparent);
            opacity: 0; transform: translateY(30px) scale(.9); transition: all .45s cubic-bezier(.2,1.3,.4,1); }
        .card.show { opacity: 1; transform: none; }
        .who { display: flex; align-items: center; gap: 14px; }
        .who img { width: 74px; height: 74px; border-radius: 50%; object-fit: cover; border: 3px solid var(--c1); background: #222; }
        .who .name { font-size: 24px; font-weight: 900; line-height: 1.1; }
        .who .handle { opacity: .7; font-size: 14px; }
        .lvl { margin-left: auto; text-align: center; padding: 8px 12px; border-radius: 14px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
        .lvl b { display: block; font-size: 26px; line-height: 1; }
        .lvl span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .stats { display: flex; gap: 10px; margin: 16px 0 12px; }
        .stat { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.07); text-align: center; }
        .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
        .stat span { font-size: 12px; opacity: .75; text-transform: uppercase; font-weight: 700; }
        .bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
        .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width 1s ease .3s; }
        .next { display: flex; justify-content: space-between; font-size: 12px; opacity: .75; margin-top: 6px; font-weight: 700; }
        .top h3 { margin: 0 0 12px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
        .row:last-child { border-bottom: none; }
        .row .r { width: 26px; font-weight: 900; text-align: center; }
        .row img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #222; }
        .row .n { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .l { font-size: 12px; padding: 2px 7px; border-radius: 8px; background: rgba(255,255,255,.1); }
        .row .p { font-weight: 900; font-variant-numeric: tabular-nums; }
        .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: rgba(239,68,68,.9);
            font-weight: 700; animation: fade 3.5s ease forwards; white-space: nowrap; }
        .lvlup { text-align: center; }
        .lvlup img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 4px solid var(--c1); background: #222; box-shadow: 0 0 30px var(--c1); }
        .lvlup .big { font-size: 34px; font-weight: 900; margin: 10px 0 2px; }
        .lvlup .big .g { background: linear-gradient(90deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .lvlup .who2 { font-size: 20px; font-weight: 800; }
        .lvlup .badge { display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 99px; font-weight: 900; font-size: 22px; background: linear-gradient(135deg, var(--c1), var(--c2)); animation: beat 1s ease-in-out 3; }
        .confetti { position: fixed; top: -10px; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; animation: drop linear forwards; }
        @keyframes beat { 50% { transform: scale(1.15); } }
        @keyframes drop { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
        @keyframes fade { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
    </style>
    <link rel="stylesheet" href="/overlay-themes.css">
</head>

<body>
    <div id="stage"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // Affiche la carte d'un spectateur quand il tape !score, et le top 5 avec !top.
        // URL parameters: duration=7, toasts=1 (message "pas assez de points"), levelup=1 (fête les passages de niveau),
        //                 minlevel=2 (niveau minimum fêté), color, color2, font, lang, demo=1
        const G = window.Gentok;
        document.documentElement.style.setProperty('--c1', G.colorParam('color', '#fe2c55'));
        document.documentElement.style.setProperty('--c2', G.colorParam('color2', '#ff8a00'));
        const duration = Math.min(Math.max(G.numParam('duration', 7), 2), 60);
        const stage = document.getElementById('stage');
        const queue = [];
        let busy = false;
        const img = (u) => G.escapeHtml(G.safeUrl(u) || '/logo.png');

        function scoreCard(d) {
            const pct = Math.round((Number(d.progress) || 0) * 100);
            return `<div class="who"><img src="${img(d.profilePictureUrl)}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                <div><div class="name">${G.escapeHtml(d.nickname || d.uniqueId)}</div><div class="handle">@${G.escapeHtml(d.uniqueId)}</div></div>
                <div class="lvl"><span>${G.escapeHtml(G.t('points.level'))}</span><b>${G.escapeHtml(d.level || 0)}</b></div></div>
                <div class="stats">
                    <div class="stat"><b>${G.formatNumber(d.points)}</b><span>${G.escapeHtml(G.t('points.points'))}</span></div>
                    <div class="stat"><b>${d.rank ? '#' + G.escapeHtml(d.rank) : '—'}</b><span>${G.escapeHtml(G.t('points.rank'))}</span></div>
                </div>
                <div class="bar ov-track"><div data-w="${pct}%"></div></div>
                <div class="next"><span>${G.escapeHtml(G.t('points.level'))} ${G.escapeHtml(d.level || 0)}</span><span>${G.escapeHtml(G.t('points.next'))} : ${G.formatNumber(d.nextLevelPoints)}</span></div>`;
        }

        function topCard(d) {
            const rows = (d.top || []).map((u, i) => `<div class="row"><span class="r">${i === 0 ? '👑' : i + 1}</span>
                <img src="${img(u.profilePictureUrl)}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                <span class="n">${G.escapeHtml(u.nickname)}</span><span class="l">Lv ${G.escapeHtml(u.level)}</span>
                <span class="p">${G.formatNumber(u.points)}</span></div>`).join('');
            return `<div class="top"><h3>🏅 ${G.escapeHtml(G.t('points.top'))}</h3>${rows || `<div style="text-align:center;opacity:.7">${G.escapeHtml(G.t('rank.empty'))}</div>`}</div>`;
        }

        function levelUpCard(d) {
            return `<div class="lvlup"><img src="${img(d.profilePictureUrl)}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                <div class="big"><span class="e">🎉</span> <span class="g">${G.escapeHtml(G.t('points.levelup'))}</span></div>
                <div class="who2">${G.escapeHtml(d.nickname || d.uniqueId)}</div>
                <div class="badge">${G.escapeHtml(G.t('points.level'))} ${G.escapeHtml(d.level)}</div></div>`;
        }

        function confetti() {
            const colors = [getComputedStyle(document.documentElement).getPropertyValue('--c1'), getComputedStyle(document.documentElement).getPropertyValue('--c2'), '#fbbf24', '#25f4ee', '#fff'];
            for (let i = 0; i < 70; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[i % colors.length];
                c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
                c.style.animationDelay = (Math.random() * 0.6) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4500);
            }
        }

        function next() {
            if (busy || !queue.length) return;
            busy = true;
            const html = queue.shift();
            const el = document.createElement('div');
            el.className = 'card ov-surface';
            el.innerHTML = html;
            if (html.includes('class="lvlup"')) confetti();
            stage.appendChild(el);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                el.classList.add('show');
                el.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w);
            }));
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => { el.remove(); busy = false; next(); }, 450);
            }, duration * 1000);
        }

        const push = (html) => { if (queue.length < 8) queue.push(html); next(); };

        const socket = G.connect();
        socket.on('points_score', (d) => d && push(scoreCard(d)));
        socket.on('points_top', (d) => d && push(topCard(d)));
        const minLevel = Math.max(1, G.numParam('minlevel', 2));
        socket.on('points_levelup', (d) => {
            if (d && G.boolParam('levelup', true) && Number(d.level) >= minLevel) push(levelUpCard(d));
        });
        socket.on('points_insufficient', (d) => {
            if (!d || !G.boolParam('toasts', true)) return;
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = G.t('points.notEnough', { name: d.nickname || d.uniqueId, n: d.cost });
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3600);
        });

        if (G.isDemo) {
            let n = 0;
            const demo = () => push(n++ % 2 === 0
                ? scoreCard({ ...G.demoUser(), points: 12840, level: 16, rank: 3, progress: 0.62, nextLevelPoints: 14450 })
                : levelUpCard({ ...G.demoUser(), level: 17 }));
            demo();
            setInterval(demo, (duration + 1) * 1000);
        }
    </script>
</body>

</html>
