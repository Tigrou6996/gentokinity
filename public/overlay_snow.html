<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Falling Snow</title>
    <style>
        html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
        canvas { position: fixed; inset: 0; }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <script src="/overlay-common.js"></script>
    <script>
        // Ambiance : neige ou autres particules qui tombent en continu (aucun événement nécessaire).
        // Conseil : source navigateur en 1920x1080.
        // URL parameters: type=snow|hearts|stars|sakura|confetti|leaves|money, count=140, speed=1, wind=0.3, size=1, opacity=0.9
        const G = window.Gentok;
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const TYPES = ['snow', 'hearts', 'stars', 'sakura', 'confetti', 'leaves', 'money'];
        const type = TYPES.includes(G.param('type', 'snow')) ? G.param('type', 'snow') : 'snow';
        const COUNT = Math.min(Math.max(G.numParam('count', 140), 10), 800);
        const SPEED = Math.min(Math.max(G.numParam('speed', 1), 0.1), 5);
        const WIND = Math.min(Math.max(G.numParam('wind', 0.3), -3), 3);
        const SCALE = Math.min(Math.max(G.numParam('size', 1), 0.3), 4);
        const OPACITY = Math.min(Math.max(G.numParam('opacity', 0.9), 0.1), 1);
        const COLORS = {
            snow: ['#ffffff'], hearts: ['#fe2c55', '#ff6b9d', '#ffc2d6'], stars: ['#fde68a', '#fbbf24', '#ffffff'],
            sakura: ['#ffc0d9', '#ffb3cf', '#ffd6e5'], confetti: ['#fe2c55', '#25f4ee', '#fbbf24', '#4ade80', '#818cf8', '#ffffff'],
            leaves: ['#f59e0b', '#d97706', '#b45309', '#ef4444'], money: ['#22c55e', '#16a34a']
        };
        let W, H, flakes = [];

        function make(initial) {
            const depth = 0.4 + Math.random() * 0.6; // far flakes are smaller and slower
            return {
                x: Math.random() * W, y: initial ? Math.random() * H : -20,
                r: (type === 'snow' ? 1.5 + Math.random() * 3.5 : 6 + Math.random() * 7) * depth * SCALE,
                vy: (25 + Math.random() * 45) * depth * SPEED, sway: Math.random() * Math.PI * 2, swaySpeed: 0.5 + Math.random() * 1.5,
                rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 3, depth,
                c: COLORS[type][Math.floor(Math.random() * COLORS[type].length)]
            };
        }
        function resize() {
            W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
            flakes = Array.from({ length: COUNT }, () => make(true));
        }
        window.addEventListener('resize', resize); resize();

        function shape(f) {
            const r = f.r;
            ctx.fillStyle = f.c;
            switch (type) {
                case 'snow':
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); break;
                case 'hearts':
                    ctx.beginPath(); ctx.moveTo(0, r * 0.35);
                    ctx.bezierCurveTo(0, -r * 0.3, -r, -r * 0.3, -r, r * 0.25); ctx.bezierCurveTo(-r, r * 0.8, 0, r, 0, r * 1.3);
                    ctx.bezierCurveTo(0, r, r, r * 0.8, r, r * 0.25); ctx.bezierCurveTo(r, -r * 0.3, 0, -r * 0.3, 0, r * 0.35); ctx.fill(); break;
                case 'stars':
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
                    ctx.closePath(); ctx.fill(); break;
                case 'sakura':
                    for (let i = 0; i < 5; i++) { ctx.rotate(Math.PI * 2 / 5); ctx.beginPath(); ctx.ellipse(0, -r * 0.55, r * 0.35, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
                    break;
                case 'confetti':
                    ctx.fillRect(-r * 0.4, -r * 0.8, r * 0.8, r * 1.6); break;
                case 'leaves':
                    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke(); break;
                case 'money':
                    ctx.fillRect(-r, -r * 0.5, r * 2, r); ctx.fillStyle = 'rgba(255,255,255,.75)';
                    ctx.font = `bold ${Math.round(r * 0.9)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1); break;
            }
        }

        let last = performance.now(), t = 0;
        function frame(now) {
            const dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;
            ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < flakes.length; i++) {
                const f = flakes[i];
                f.y += f.vy * dt;
                f.x += (WIND * 40 * f.depth + Math.sin(t * f.swaySpeed + f.sway) * 18 * f.depth) * dt;
                f.rot += f.vr * dt;
                if (f.y > H + 30 || f.x < -40 || f.x > W + 40) { flakes[i] = make(false); if (f.x < -40) flakes[i].x = W + 20; else if (f.x > W + 40) flakes[i].x = -20; continue; }
                ctx.save();
                ctx.globalAlpha = OPACITY * (0.5 + f.depth * 0.5);
                ctx.translate(f.x, f.y);
                if (type !== 'snow') ctx.rotate(f.rot);
                if (type === 'snow') { ctx.shadowColor = '#fff'; ctx.shadowBlur = f.r * 2; }
                shape(f);
                ctx.restore();
            }
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>

</html>
