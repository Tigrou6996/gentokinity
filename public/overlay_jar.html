<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Jar</title>
    <style>
        html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; }
        .label { position: fixed; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 900; text-align: center; white-space: nowrap;
            text-shadow: 0 2px 6px rgba(0,0,0,.9); pointer-events: none; }
        .label .t { font-size: 18px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .9; }
        .label .n { font-size: 30px; font-variant-numeric: tabular-nums; }
        .label { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 99px; background: rgba(20,20,28,.85);
            font-size: 16px; font-weight: 800; text-shadow: none; }
        .pill img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #222; }
        .pill .c { color: #fbbf24; margin-left: 10px; font-variant-numeric: tabular-nums; }
        .pill.total { padding: 5px 14px; font-size: 18px; }
        .pill.total .c { margin-left: 0; }
        .bubble { position: fixed; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 99px; background: rgba(20,20,28,.9);
            color: #fff; font-weight: 700; font-size: 16px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.4); animation: bub 4s ease forwards; pointer-events: none; }
        .bubble img.av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; }
        .bubble img.g { width: 26px; height: 26px; object-fit: contain; }
        .bubble b { font-weight: 900; }
        .bubble .c { color: #fbbf24; font-weight: 900; }
        .bubble::after { content: ''; position: absolute; bottom: -8px; left: 60%; border: 8px solid transparent; border-top-color: rgba(20,20,28,.9); border-bottom: 0; }
        @keyframes bub { 0% { opacity: 0; transform: translateY(10px) scale(.9); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div class="label" id="label"><div class="t" id="title"></div><div id="top"></div><div class="pill total"><span class="c" id="count"></span></div></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // Pot à cadeaux : chaque cadeau reçu tombe dans un bocal et s'y empile (physique simple).
        // URL parameters:
        //   size=34     taille d'un cadeau (px)          max=160   nombre maximum dans le bocal (les plus anciens disparaissent)
        //   width=420   largeur du bocal (px)            style=glass|neon|wood|gold   (dessin du bocal)
        //   likes=0     des cœurs tombent aussi avec les likes     counter=1  total des pièces sous le bocal
        //   title=...   texte au-dessus du total         persist=1  garde le contenu si l'overlay est rechargé
        //   reset=1     vide le bocal à chaque chargement de l'overlay (ex : au début de chaque live)
        //   bubble=1    bulle « X a offert … »       top=1  meilleur donateur sous le bocal
        //   color=fe2c55, font, lang, demo=1
        const G = window.Gentok;
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const R = Math.min(Math.max(G.numParam('size', 34), 10), 120) / 2;
        const MAX = Math.min(Math.max(G.numParam('max', 160), 10), 400);
        const JAR_W = Math.min(Math.max(G.numParam('width', 420), 120), 1600);
        const STYLE = ['glass', 'neon', 'wood', 'gold'].includes(G.param('style', 'glass')) ? G.param('style', 'glass') : 'glass';
        const ACCENT = G.colorParam('color', '#fe2c55');
        const withLikes = G.boolParam('likes', false);
        const showCounter = G.boolParam('counter', true);
        const persist = G.boolParam('persist', true) && !G.isDemo;
        const STORE = `gentok_jar_${G.token || 'demo'}`;
        const showBubble = G.boolParam('bubble', true);
        const showTop = G.boolParam('top', true);
        let donors = {}; // uniqueId -> { nickname, avatar, coins }

        let W = 0, H = 0, jar = null;
        const bodies = [];
        const images = new Map();
        let coins = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            const w = Math.min(JAR_W, W - 20);
            const labelSpace = showCounter ? (showTop ? 104 : 60) : 10;
            const h = Math.min(w * 1.25, H - labelSpace - 30);
            const inset = w * 0.09;
            jar = { x0: (W - w) / 2, x1: (W + w) / 2, top: H - labelSpace - h, bottom: H - labelSpace, wall: 6, radius: Math.min(56, w / 4.5),
                inset, neck: Math.min(34, h * 0.08), shoulder: Math.min(46, h * 0.1) };
            document.getElementById('label').style.top = (jar.bottom + 8) + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        function image(src) {
            if (!images.has(src)) {
                const img = new Image();
                img.referrerPolicy = 'no-referrer';
                img.src = src;
                images.set(src, img);
            }
            return images.get(src);
        }

        function save() {
            if (!persist) return;
            try { localStorage.setItem(STORE, JSON.stringify({ coins, donors, items: bodies.slice(-MAX).map(b => b.src || b.emoji) })); } catch (e) { }
        }

        function add(content, isImage, delay = 0) {
            setTimeout(() => {
                const r = R * (0.85 + Math.random() * 0.3);
                bodies.push({
                    x: jar.x0 + jar.inset + jar.wall + r + Math.random() * Math.max(1, jar.x1 - jar.x0 - 2 * (jar.inset + jar.wall + r)),
                    y: jar.top - r - Math.random() * 60, vx: (Math.random() - 0.5) * 60, vy: 0, r,
                    a: Math.random() * Math.PI * 2, va: (Math.random() - 0.5) * 4,
                    src: isImage ? content : null, emoji: isImage ? null : content, img: isImage ? image(content) : null, born: performance.now()
                });
                while (bodies.length > MAX) bodies.shift();
            }, delay);
        }

        function burst(content, isImage, count) {
            const n = Math.min(Math.max(1, count), 30);
            for (let i = 0; i < n; i++) add(content, isImage, i * 90);
        }

        // ---- physics (3 sub-steps per frame, circle vs circle and circle vs jar)
        const GRAVITY = 1600;
        function step(dt) {
            const left = jar.x0 + jar.wall, right = jar.x1 - jar.wall, floor = jar.bottom - jar.wall, cr = jar.radius;
            for (const b of bodies) {
                b.vy += GRAVITY * dt;
                b.vx *= 0.995; b.va *= 0.98;
                b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
                if (b.y + b.r < jar.top) continue; // still falling above the jar
                if (b.x - b.r < left) { b.x = left + b.r; b.vx = Math.abs(b.vx) * 0.3; }
                if (b.x + b.r > right) { b.x = right - b.r; b.vx = -Math.abs(b.vx) * 0.3; }
                // rounded bottom corners
                for (const cx of [left + cr, right - cr]) {
                    const cy = floor - cr;
                    if ((cx < left + cr + 1 && b.x < cx) || (cx > right - cr - 1 && b.x > cx)) {
                        if (b.y > cy) {
                            const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy) || 1;
                            if (d + b.r > cr) {
                                const nx = dx / d, ny = dy / d;
                                b.x = cx + nx * (cr - b.r); b.y = cy + ny * (cr - b.r);
                                const vn = b.vx * nx + b.vy * ny;
                                if (vn > 0) { b.vx -= 1.3 * vn * nx; b.vy -= 1.3 * vn * ny; }
                            }
                        }
                    }
                }
                if (b.y + b.r > floor) { b.y = floor - b.r; b.vy = -Math.abs(b.vy) * 0.25; b.vx *= 0.9; b.va = b.vx / b.r; }
            }
            for (let i = 0; i < bodies.length; i++) {
                const p = bodies[i];
                for (let j = i + 1; j < bodies.length; j++) {
                    const q = bodies[j];
                    const dx = q.x - p.x, dy = q.y - p.y, min = p.r + q.r;
                    if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
                    const d2 = dx * dx + dy * dy;
                    if (d2 >= min * min || d2 === 0) continue;
                    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, push = (min - d) / 2;
                    p.x -= nx * push; p.y -= ny * push; q.x += nx * push; q.y += ny * push;
                    const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
                    if (rv < 0) {
                        const imp = -rv * 0.6;
                        p.vx -= imp * nx; p.vy -= imp * ny; q.vx += imp * nx; q.vy += imp * ny;
                    }
                }
            }
        }

        // ---- drawing
        // Mason jar: neck with threads, rounded shoulders and bottom
        function jarPath() {
            const { x0, x1, top, bottom, radius, inset, neck, shoulder } = jar;
            const bodyTop = top + neck + shoulder;
            ctx.beginPath();
            ctx.moveTo(x0 + inset, top);
            ctx.lineTo(x0 + inset, top + neck);
            ctx.bezierCurveTo(x0 + inset, top + neck + shoulder * 0.6, x0, top + neck + shoulder * 0.3, x0, bodyTop);
            ctx.lineTo(x0, bottom - radius);
            ctx.quadraticCurveTo(x0, bottom, x0 + radius, bottom);
            ctx.lineTo(x1 - radius, bottom);
            ctx.quadraticCurveTo(x1, bottom, x1, bottom - radius);
            ctx.lineTo(x1, bodyTop);
            ctx.bezierCurveTo(x1, top + neck + shoulder * 0.3, x1 - inset, top + neck + shoulder * 0.6, x1 - inset, top + neck);
            ctx.lineTo(x1 - inset, top);
        }

        const STYLES = {
            glass: { fill: 'rgba(255,255,255,0.07)', stroke: 'rgba(255,255,255,0.75)', glow: null, rim: 'rgba(255,255,255,0.85)' },
            neon: { fill: 'rgba(10,10,25,0.45)', stroke: ACCENT, glow: ACCENT, rim: ACCENT },
            wood: { fill: 'rgba(120,72,30,0.25)', stroke: '#8b5a2b', glow: null, rim: '#6b3f1d' },
            gold: { fill: 'rgba(255,215,0,0.08)', stroke: '#fbbf24', glow: '#f59e0b', rim: '#fde68a' }
        };

        function draw() {
            const st = STYLES[STYLE];
            ctx.clearRect(0, 0, W, H);
            // jar back
            jarPath(); ctx.closePath(); ctx.fillStyle = st.fill; ctx.fill();
            // contents
            for (const b of bodies) {
                ctx.save();
                ctx.translate(b.x, b.y); ctx.rotate(b.a);
                if (b.img && b.img.complete && b.img.naturalWidth) {
                    ctx.drawImage(b.img, -b.r, -b.r, b.r * 2, b.r * 2);
                } else {
                    ctx.font = `${Math.round(b.r * 1.7)}px sans-serif`;
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(b.emoji || '🎁', 0, 0);
                }
                ctx.restore();
            }
            // jar front: outline, rim and a light reflection
            ctx.save();
            if (st.glow) { ctx.shadowColor = st.glow; ctx.shadowBlur = 18; }
            ctx.lineWidth = jar.wall; ctx.strokeStyle = st.stroke; ctx.lineJoin = 'round';
            jarPath(); ctx.stroke();
            // rim (seen from slightly above) and threads of the neck
            const cx = (jar.x0 + jar.x1) / 2, rx = (jar.x1 - jar.x0) / 2 - jar.inset + 6;
            ctx.lineWidth = jar.wall * 1.2; ctx.strokeStyle = st.rim;
            ctx.beginPath(); ctx.ellipse(cx, jar.top, rx, Math.max(6, rx * 0.12), 0, 0, Math.PI * 2); ctx.stroke();
            ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
            for (let k = 1; k <= 2; k++) {
                const y = jar.top + (jar.neck * k) / 3;
                ctx.beginPath(); ctx.ellipse(cx, y, rx - 2, Math.max(5, rx * 0.1), 0, 0, Math.PI); ctx.stroke();
            }
            ctx.globalAlpha = 1;
            // bottom of the glass
            ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
            ctx.beginPath(); ctx.ellipse(cx, jar.bottom - 10, (jar.x1 - jar.x0) / 2 - jar.radius * 0.5, 10, 0, 0, Math.PI); ctx.stroke();
            ctx.restore();
            if (STYLE === 'glass' || STYLE === 'gold') {
                ctx.save();
                ctx.globalAlpha = 0.25; ctx.strokeStyle = '#fff'; ctx.lineWidth = jar.wall * 1.4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(jar.x0 + 22, jar.top + jar.neck + jar.shoulder + 20); ctx.lineTo(jar.x0 + 22, jar.bottom - jar.radius - 10); ctx.stroke();
                ctx.restore();
            }
        }

        let last = performance.now();
        function frame(now) {
            const dt = Math.min((now - last) / 1000, 1 / 30);
            last = now;
            for (let i = 0; i < 3; i++) step(dt / 3);
            draw();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function renderLabel() {
            document.getElementById('label').style.display = showCounter ? '' : 'none';
            document.getElementById('title').textContent = G.param('title', '');
            document.getElementById('count').textContent = `🪙 ${G.formatNumber(coins)}`;
            const best = Object.values(donors).sort((a, b) => b.coins - a.coins)[0];
            document.getElementById('top').innerHTML = showTop && best
                ? `<div class="pill" title="${G.escapeHtml(G.t('jar.top'))}">🎖️<img src="${G.escapeHtml(G.safeUrl(best.avatar) || '/logo.png')}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                    <span>${G.escapeHtml(best.nickname)}</span><span class="c">🪙 ${G.formatNumber(best.coins)}</span></div>` : '';
        }

        function bubble(d, n, gift) {
            if (!showBubble) return;
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            const el = document.createElement('div');
            el.className = 'bubble';
            const text = G.escapeHtml(G.t('jar.donated', { name: '\u0001', gift: '\u0002', n, c: '\u0003' }))
                .replace('\u0001', `<b>${G.escapeHtml(d.nickname || d.uniqueId || '')}</b>`)
                .replace('\u0002', gift ? `<img class="g" src="${G.escapeHtml(gift)}" referrerpolicy="no-referrer"> <b>${G.escapeHtml(d.giftName || '')}</b> ` : `<b>${G.escapeHtml(d.giftName || '🎁')}</b> `)
                .replace('\u0003', `<span class="c">${G.formatNumber(Number(d.coins) || 0)}</span>`);
            el.innerHTML = `<img class="av" src="${G.escapeHtml(G.avatarOf(d))}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'"><span>${text}</span>`;
            el.style.left = Math.max(8, jar.x0 - 40) + 'px';
            el.style.top = (jar.top + (jar.bottom - jar.top) * 0.3) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4100);
        }

        function emptyJar() {
            bodies.length = 0; coins = 0; donors = {};
            try { localStorage.removeItem(STORE); } catch (e) { }
            renderLabel();
        }

        // Restore the jar after a reload of the source in OBS
        if (G.boolParam('reset', false)) { try { localStorage.removeItem(STORE); } catch (e) { } }
        if (persist) {
            try {
                const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
                if (saved && Array.isArray(saved.items)) {
                    coins = Number(saved.coins) || 0;
                    if (saved.donors && typeof saved.donors === 'object') donors = saved.donors;
                    saved.items.slice(-MAX).forEach((it, i) => {
                        const isImg = /^(https?:)?\//.test(it);
                        add(isImg ? G.safeUrl(it) || '/logo.png' : it, isImg, i * 8);
                    });
                }
            } catch (e) { }
        }
        renderLabel();
        setInterval(save, 5000);

        function onGift(d) {
            const icon = G.giftImage(d);
            const n = Number(d.repeatCount) || 1;
            if (icon) burst(icon, true, n); else burst('🎁', false, n);
            const c = Number(d.coins) || 0;
            coins += c;
            if (d.uniqueId) {
                const k = String(d.uniqueId);
                donors[k] = { nickname: d.nickname || k, avatar: d.profilePictureUrl || '', coins: ((donors[k] && donors[k].coins) || 0) + c };
                const keep = Object.entries(donors).sort((a, b) => b[1].coins - a[1].coins).slice(0, 50); // keeps the storage small
                donors = Object.fromEntries(keep);
            }
            bubble(d, n, icon);
            renderLabel();
        }

        const socket = G.connect();
        socket.on('overlay_command', (c) => { if (c && c.command === 'jar_reset') emptyJar(); });
        socket.on('stats', (p) => {
            if (!p || !p.type) return;
            const d = p.data || {};
            if (p.type === 'gift') {
                onGift(d);
            } else if (p.type === 'like' && withLikes) {
                burst('❤️', false, Math.min(Number(d.likeCount) || 1, 3));
            }
        });

        if (G.isDemo) {
            setInterval(() => onGift({ ...G.demoUser(), ...G.demoGift(), giftName: 'Rose' }), 900);
        }
    </script>
</body>

</html>
