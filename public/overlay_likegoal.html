<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Likes Goal</title>
    <style>
        :root { --c1: #fe2c55; --c2: #ff8a00; --w: 560px; }
        html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        .goal { position: relative; width: var(--w); max-width: calc(100vw - 24px); margin: 12px; color: #fff; }
        .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .title { font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .emoji { display: inline-block; animation: beat 1.2s ease-in-out infinite; }
        .count { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .count small { opacity: .7; font-weight: 700; }
        .track { position: relative; height: 34px; border-radius: 999px; overflow: hidden; }
        .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.9,.2,1); }
        .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
            transform: translateX(-100%); animation: shine 2.4s ease-in-out infinite; }
        .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
        .footer { margin-top: 8px; font-size: 15px; font-weight: 700; opacity: .9; text-align: center; min-height: 20px; }
        .heart { position: fixed; bottom: 20px; font-size: 26px; pointer-events: none; animation: rise 2.2s ease-out forwards; }
        .goal.done .track { animation: pulse 0.9s ease-in-out 4; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(1); } }
        @keyframes shine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
        @keyframes rise { from { opacity: 1; transform: translateY(0) scale(.8); } to { opacity: 0; transform: translateY(-160px) scale(1.4) rotate(var(--r)); } }
        @keyframes pulse { 50% { transform: scale(1.03); filter: brightness(1.4); } }

        /* Themes */
        .theme-neon .track { background: #0b0b14; border: 2px solid var(--c1); box-shadow: 0 0 18px var(--c1), inset 0 0 12px rgba(0,0,0,.8); }
        .theme-neon .fill { background: linear-gradient(90deg, var(--c1), var(--c2)); box-shadow: 0 0 22px var(--c1); }
        .theme-neon .title, .theme-neon .count { text-shadow: 0 0 10px var(--c1), 0 2px 4px #000; }

        .theme-glass { padding: 16px 18px; border-radius: 22px; background: rgba(255,255,255,.10); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.25); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
        .theme-glass .track { background: rgba(255,255,255,.15); }
        .theme-glass .fill { background: linear-gradient(90deg, var(--c1), var(--c2)); }

        .theme-gradient { padding: 16px 18px; border-radius: 22px; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
        .theme-gradient .track { background: rgba(0,0,0,.25); }
        .theme-gradient .fill { background: #fff; }
        .theme-gradient .pct { color: #111; text-shadow: none; }

        .theme-minimal .track { height: 14px; background: rgba(255,255,255,.18); }
        .theme-minimal .fill { background: var(--c1); }
        .theme-minimal .pct { display: none; }
        .theme-minimal .title, .theme-minimal .count { text-shadow: 0 2px 6px rgba(0,0,0,.9); font-size: 20px; }

        .theme-candy .track { height: 40px; background: #fff; border: 4px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
        .theme-candy .fill { background: repeating-linear-gradient(45deg, var(--c1) 0 18px, var(--c2) 18px 36px); background-size: 51px 51px; animation: candy 1s linear infinite; }
        .theme-candy .title, .theme-candy .count { color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.35); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
        @keyframes candy { to { background-position: 51px 0; } }

        .theme-retro { padding: 14px; background: #111; border: 4px solid #fff; box-shadow: 6px 6px 0 var(--c1); font-family: 'Press Start 2P', monospace; }
        .theme-retro .title, .theme-retro .count { font-size: 13px; }
        .theme-retro .track { border-radius: 0; height: 26px; background: #333; }
        .theme-retro .fill { border-radius: 0; background: repeating-linear-gradient(90deg, var(--c1) 0 14px, transparent 14px 18px); }
        .theme-retro .fill::after { display: none; }
        .theme-retro .pct { font-size: 10px; }
    </style>
</head>

<body>
    <div class="goal" id="goal">
        <div class="head">
            <div class="title"><span class="emoji" id="emoji">❤️</span><span id="title"></span></div>
            <div class="count"><span id="cur">0</span> <small>/ <span id="target">0</span></small></div>
        </div>
        <div class="track"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
        <div class="footer" id="footer"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // URL parameters:
        //   theme=neon|glass|gradient|minimal|candy|retro   (défaut neon)
        //   target=10000   objectif si l'objectif de likes du tableau de bord est désactivé
        //   title=...      emoji=❤️   footer=1 ("Plus que X likes")   hearts=1 (cœurs qui s'envolent)
        //   width=560, color=fe2c55, color2=ff8a00, font=..., lang=..., demo=1
        // Suit l'objectif de likes configuré dans le tableau de bord (Overlays > Objectif de Likes) quand il est activé.
        const G = window.Gentok;
        const root = document.documentElement;
        root.style.setProperty('--c1', G.colorParam('color', '#fe2c55'));
        root.style.setProperty('--c2', G.colorParam('color2', '#ff8a00'));
        root.style.setProperty('--w', `${Math.min(Math.max(G.numParam('width', 560), 200), 1600)}px`);
        const theme = ['neon', 'glass', 'gradient', 'minimal', 'candy', 'retro'].includes(G.param('theme', 'neon')) ? G.param('theme', 'neon') : 'neon';
        const goalEl = document.getElementById('goal');
        goalEl.classList.add('theme-' + theme);
        document.getElementById('emoji').textContent = G.param('emoji', '❤️');
        const showFooter = G.boolParam('footer', true);
        const hearts = G.boolParam('hearts', true);
        let target = Math.max(1, G.numParam('target', 10000));
        let title = G.param('title', '');
        let count = 0;
        let serverGoal = false;

        function render() {
            const pct = Math.min(100, Math.floor((count / target) * 100));
            document.getElementById('title').textContent = title || G.t('goal.likes');
            document.getElementById('cur').textContent = G.formatNumber(count);
            document.getElementById('target').textContent = G.formatNumber(target);
            document.getElementById('fill').style.width = pct + '%';
            document.getElementById('pct').textContent = pct + '%';
            const done = count >= target;
            goalEl.classList.toggle('done', done);
            document.getElementById('footer').textContent = !showFooter ? '' :
                (done ? G.t('goal.done') : G.t('goal.remaining', { n: G.formatNumber(target - count) }));
        }

        function heartBurst(n) {
            if (!hearts) return;
            for (let i = 0; i < Math.min(n, 6); i++) {
                const h = document.createElement('div');
                h.className = 'heart';
                h.textContent = ['❤️', '💖', '💗', '💕'][Math.floor(Math.random() * 4)];
                h.style.left = (20 + Math.random() * (Math.min(window.innerWidth, 600) - 40)) + 'px';
                h.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
                h.style.animationDelay = (i * 0.08) + 's';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 2600);
            }
        }

        function setCount(n) {
            n = Number(n) || 0;
            if (n > count) heartBurst(Math.ceil((n - count) / 50));
            count = n;
            render();
        }

        render();
        const socket = G.connect();
        socket.on('likes_goal_update', (g) => {
            if (!g || g.enabled === false) { serverGoal = false; return; }
            serverGoal = true;
            if (g.goal) target = Math.max(1, Number(g.goal));
            if (g.title && !G.param('title', '')) title = g.title;
            setCount(g.count);
        });
        socket.on('session_stats', (s) => {
            if (!serverGoal && s && s.likes !== undefined) setCount(s.likes);
        });

        if (G.isDemo) setInterval(() => setCount(count + Math.ceil(target / 15)), 1300);
    </script>
</body>

</html>
