<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentok</title>
    <script src="/i18n.js"></script>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css">
    <meta name="referrer" content="no-referrer">
    <style>
        html, body { height: 100%; }
        body { background: #1a1d21; display: flex; align-items: center; justify-content: center; margin: 0; }
        .launcher { width: min(380px, calc(100vw - 32px)); }
        .launcher img { width: 56px; height: 56px; border-radius: 12px; }
        .progress { height: 6px; background: #343a40; }
        .progress-bar { background: #fe2c55; transition: width .4s ease; }
        #status { min-height: 1.5em; }
    </style>
</head>

<body>
    <div class="launcher card border-secondary-subtle bg-body-tertiary p-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <img src="/logo.png" alt="Gentok">
            <div>
                <div class="fs-5 fw-semibold">Gentok</div>
                <div class="small text-body-secondary">Démarrage de l'application</div>
            </div>
        </div>
        <div id="status" class="small mb-2">Vérification des mises à jour...</div>
        <div class="progress mb-2" role="progressbar" aria-label="Progression">
            <div id="bar" class="progress-bar" style="width: 5%"></div>
        </div>
        <div id="result" class="small text-body-secondary" style="opacity: 0;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const barEl = document.getElementById('bar');
        const resultEl = document.getElementById('result');

        // Connect to local socket to catch startup errors
        const socket = io('http://localhost:3000');
        let hasError = false;

        socket.on('log', (data) => {
            if (data.level === 'error') {
                statusEl.textContent = data.message;
                statusEl.style.color = '#ef4444';
                statusEl.classList.remove('searching');
                hasError = true;
            }
        });

        socket.on('notification', (data) => {
            if (data.type === 'error') {
                statusEl.textContent = data.message;
                statusEl.style.color = '#ef4444';
                statusEl.classList.remove('searching');
                hasError = true;
            }
        });

        // Follows the real auto-updater of the Windows app (main.js). In a web browser there is nothing to update.
        async function runUpdateCheck() {
            const api = window.electronAPI;
            const done = async (text, color) => {
                updateProgress(100);
                statusEl.classList.remove('searching');
                statusEl.textContent = text;
                statusEl.style.color = color || '#10b981';
                resultEl.style.opacity = '1';
                await sleep(hasError ? 3000 : 900);
                window.location.href = '/' + window.location.search;
            };
            if (!api || !api.getUpdateState) {
                updateProgress(60);
                await sleep(500);
                return done('Prêt');
            }

            const version = await api.getAppVersion().catch(() => '');
            resultEl.textContent = version ? `Version installée : v${version}` : '';
            statusEl.textContent = 'Recherche de mises à jour...';
            updateProgress(15);

            let finished = false;
            const onState = (st) => {
                if (finished || !st) return;
                if (st.status === 'checking' || st.status === 'idle') {
                    statusEl.textContent = 'Recherche de mises à jour...';
                    updateProgress(25);
                } else if (st.status === 'downloading') {
                    statusEl.textContent = `Téléchargement de la v${st.version || ''}... ${st.percent || 0}%`;
                    updateProgress(25 + Math.round((st.percent || 0) * 0.7));
                } else if (st.status === 'downloaded') {
                    finished = true;
                    statusEl.classList.remove('searching');
                    statusEl.textContent = `Installation de la v${st.version || ''}... Gentok va redémarrer.`;
                    updateProgress(100);
                } else {
                    // up-to-date, dev (not installed) or error: never block the streamer
                    finished = true;
                    const msg = st.status === 'error' ? 'Mise à jour impossible pour le moment' : 'Application à jour';
                    done(`${msg}${version ? ` (v${version})` : ''}`, st.status === 'error' ? '#fbbf24' : '#10b981');
                }
            };
            api.onUpdateState(onState);
            const poll = setInterval(async () => onState(await api.getUpdateState().catch(() => null)), 700);
            onState(await api.getUpdateState().catch(() => null));
            // Slow network: after 12 s the check goes on in the background and the dashboard shows it
            setTimeout(() => { if (!finished) { finished = true; clearInterval(poll); done('Ouverture de Gentok...'); } }, 12000);
        }

        function updateProgress(val) {
            barEl.style.width = val + '%';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        runUpdateCheck();
    </script>
</body>

</html>
