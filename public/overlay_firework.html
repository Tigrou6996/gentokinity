<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Gift Firework</title>
    <meta name="referrer" content="no-referrer">
    <style>
        html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { position: fixed; inset: 0; }
        .tag { position: fixed; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
            animation: tag 2.6s ease-out forwards; }
        .tag img.av { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: #222; }
        .tag img.gift { position: absolute; top: 30px; left: calc(50% + 12px); width: 34px; height: 34px; object-fit: contain; }
        .tag span { color: #fff; font-weight: 900; font-size: 26px; white-space: nowrap; text-shadow: 0 0 10px var(--c), 0 0 22px var(--c), 0 2px 4px #000; }
        @keyframes tag { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            25% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40%) scale(1); } }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // Gift Firework : chaque cadeau lance une fusée qui explose en feu d'artifice, avec le pseudo et la photo du spectateur.
        // Plus le cadeau vaut de pièces, plus l'explosion est grande. Conseil : source navigateur en 1920x1080.
        // URL parameters: sound=1 (son de l'explosion, 0 pour couper), volume=0.5, mingift=0, names=1, max=6 (fusées par cadeau), demo=1
        const G = window.Gentok;
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const withSound = G.boolParam('sound', true);
        const VOLUME = Math.min(Math.max(G.numParam('volume', 0.5), 0), 1);
        const minGift = Math.max(0, G.numParam('mingift', 0));
        const withNames = G.boolParam('names', true);
        const MAX_ROCKETS = Math.min(Math.max(G.numParam('max', 6), 1), 20);
        const PALETTE = ['#fe2c55', '#25f4ee', '#fbbf24', '#4ade80', '#a78bfa', '#f472b6', '#ffffff', '#fb923c'];
        let W, H;
        const rockets = [], sparks = [];
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        // ---- sound (synthesized, no file needed)
        let audio = null;
        function boom(power) {
            if (!withSound) return;
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                const len = audio.sampleRate * 1.2;
                const buf = audio.createBuffer(1, len, audio.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
                const src = audio.createBufferSource(); src.buffer = buf;
                const filter = audio.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600 + power * 900;
                const gain = audio.createGain(); gain.gain.value = VOLUME * (0.5 + power * 0.5);
                src.connect(filter).connect(gain).connect(audio.destination); src.start();
            } catch (e) { /* audio not available */ }
        }

        function launch(d, power, delay) {
            setTimeout(() => {
                const x = W * (0.15 + Math.random() * 0.7);
                rockets.push({ x, y: H + 10, vx: (Math.random() - 0.5) * 60, vy: -H * (0.95 + Math.random() * 0.35), targetY: H * (0.18 + Math.random() * 0.3),
                    color: PALETTE[Math.floor(Math.random() * PALETTE.length)], power, d, trail: [] });
            }, delay);
        }

        function explode(r) {
            const n = Math.round(60 + r.power * 140);
            const color2 = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2, sp = (120 + Math.random() * 260) * (0.7 + r.power * 0.8);
                sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, ttl: 1.1 + Math.random() * 0.9,
                    c: Math.random() < 0.7 ? r.color : color2, s: 1.6 + Math.random() * 2.2 });
            }
            boom(r.power);
            if (withNames && r.d) {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.style.left = r.x + 'px'; tag.style.top = r.y + 'px'; tag.style.setProperty('--c', r.color);
                const gift = G.giftImage(r.d);
                tag.innerHTML = `<img class="av" src="${G.escapeHtml(G.avatarOf(r.d))}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">` +
                    (gift ? `<img class="gift" src="${G.escapeHtml(gift)}" referrerpolicy="no-referrer" onerror="this.remove()">` : '') +
                    `<span>${G.escapeHtml(r.d.nickname || r.d.uniqueId || '')}</span>`;
                document.body.appendChild(tag);
                setTimeout(() => tag.remove(), 2700);
            }
        }

        let last = performance.now();
        function frame(now) {
            const dt = Math.min((now - last) / 1000, 0.05); last = now;
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.vy += H * 0.35 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
                r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 14) r.trail.shift();
                ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
                ctx.beginPath(); r.trail.forEach((p, k) => (k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();
                if (r.y <= r.targetY || r.vy >= 0) { rockets.splice(i, 1); explode(r); }
            }
            for (let i = sparks.length - 1; i >= 0; i--) {
                const p = sparks[i];
                p.life += dt; p.vx *= 0.985; p.vy = p.vy * 0.985 + 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
                if (p.life > p.ttl) { sparks.splice(i, 1); continue; }
                const a = 1 - p.life / p.ttl;
                ctx.globalAlpha = a; ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.6 + a * 0.6), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function onGift(d) {
            const unit = Number(d.unitPrice) || (Number(d.coins) || 0) / Math.max(1, Number(d.repeatCount) || 1);
            if (unit < minGift) return;
            const total = Number(d.coins) || unit * (Number(d.repeatCount) || 1);
            const power = Math.min(1, Math.log10(1 + total) / 3); // 1 coin = small, 1000+ coins = huge
            const n = Math.min(MAX_ROCKETS, Math.max(1, Math.ceil((Number(d.repeatCount) || 1) / 3)));
            for (let i = 0; i < n; i++) launch(i === 0 ? d : null, power, i * 350);
        }

        const socket = G.connect();
        socket.on('stats', (p) => { if (p && p.type === 'gift' && p.data) onGift(p.data); });

        if (G.isDemo) setInterval(() => onGift({ ...G.demoUser(), ...G.demoGift() }), 1600);
    </script>
</body>

</html>
