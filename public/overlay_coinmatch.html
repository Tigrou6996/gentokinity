<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Coin Match</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root { --accent: #fe2c55; --accent2: #fbbf24; }
        html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; }
        .cm { width: min(380px, calc(100vw - 20px)); margin: 10px auto; display: flex; flex-direction: column; gap: 8px; }
        .head { text-align: center; font-weight: 900; font-size: 18px; padding: 10px; border-radius: 12px; background: rgba(40, 40, 48, .92); }
        .body { border-radius: 14px; background: rgba(40, 40, 48, .92); padding: 10px; min-height: 280px; display: flex; flex-direction: column; gap: 8px; }
        .timer { text-align: center; font-size: 48px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 8px 0; border-radius: 10px; background: rgba(255,255,255,.08); }
        .timer.hurry { color: var(--accent2); animation: blink 1s infinite; }
        .timer.over { font-size: 26px; color: var(--accent2); }
        .list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.06); animation: in .3s ease-out; }
        .row.lead { background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 35%, transparent), rgba(255,255,255,.06)); }
        .row .r { width: 22px; text-align: center; font-weight: 900; }
        .row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #222; }
        .row .n { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .c { font-weight: 900; color: var(--accent2); font-variant-numeric: tabular-nums; }
        .row.bump .c { animation: bump .5s ease; }
        .empty { margin: auto; text-align: center; opacity: .65; font-weight: 600; }
        .empty small { display: block; margin-top: 6px; font-size: 12px; opacity: .8; }
        .foot { align-self: flex-start; padding: 6px 12px; border-radius: 99px; background: rgba(40, 40, 48, .92); font-size: 14px; font-weight: 700; }
        .foot b { margin-right: 3px; }
        .winners { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
        .winners.on { display: flex; }
        .wbox { min-width: 300px; padding: 18px 22px; border-radius: 18px; background: rgba(15,15,22,.94); box-shadow: 0 0 0 2px var(--accent2), 0 20px 60px rgba(0,0,0,.6);
            text-align: center; animation: pop .6s cubic-bezier(.2,1.5,.4,1); }
        .wbox h2 { margin: 0 0 12px; font-size: 24px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; }
        .wbox .first img { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--accent2); box-shadow: 0 0 24px var(--accent2); object-fit: cover; }
        .wbox .first .n { font-size: 24px; font-weight: 900; margin-top: 6px; }
        .wbox .first .c { color: var(--accent2); font-weight: 900; font-size: 18px; }
        .wbox .others { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-weight: 700; opacity: .9; }
        @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
        @keyframes bump { 50% { transform: scale(1.3); } }
        @keyframes blink { 50% { opacity: .55; } }
        @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
    </style>
    <link rel="stylesheet" href="/overlay-themes.css">
</head>

<body>
    <div class="cm">
        <div class="head ov-surface" id="title">Coin Match</div>
        <div class="body ov-surface">
            <div class="timer ov-track" id="timer">00:00</div>
            <div class="list" id="list"></div>
        </div>
        <div class="foot ov-surface" id="foot"></div>
    </div>
    <div class="winners" id="winners"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // Coin Match : enchère en cadeaux. Lancez-la depuis le tableau de bord (Overlays > Widgets animés > Coin Match).
        // URL parameters: limit=5 (lignes affichées), hold=12 (secondes d'affichage des gagnants), title, theme, color, color2, font, lang, demo=1
        const G = window.Gentok;
        document.documentElement.style.setProperty('--accent', G.colorParam('color', '#fe2c55'));
        document.documentElement.style.setProperty('--accent2', G.colorParam('color2', '#fbbf24'));
        const limit = Math.min(Math.max(G.numParam('limit', 5), 1), 10);
        const hold = Math.min(Math.max(G.numParam('hold', 12), 3), 120);
        let state = { running: false, participants: [], count: 0 };
        let previous = new Map();
        let winnersTimer = null;
        const fmtTime = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

        function render() {
            document.getElementById('title').textContent = G.param('title', state.title || 'Coin Match');
            const list = document.getElementById('list');
            const rows = (state.participants || []).slice(0, limit);
            if (!rows.length) {
                list.innerHTML = `<div class="empty">${G.escapeHtml(G.t('cm.empty'))}<small>${G.escapeHtml(G.t('cm.hint'))}</small></div>`;
            } else {
                list.innerHTML = rows.map((p, i) => `<div class="row${i === 0 ? ' lead' : ''}${previous.has(p.uniqueId) && previous.get(p.uniqueId) < p.coins ? ' bump' : ''}">
                    <span class="r">${i === 0 ? '👑' : i + 1}</span><img src="${G.escapeHtml(G.avatarOf(p))}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                    <span class="n">${G.escapeHtml(p.nickname || p.uniqueId)}</span><span class="c">🪙 ${G.formatNumber(p.coins)}</span></div>`).join('');
            }
            previous = new Map(rows.map(p => [p.uniqueId, p.coins]));
            document.getElementById('foot').innerHTML = `<b>${G.escapeHtml(String(state.count || 0))}</b>${G.escapeHtml(G.t('cm.participants', { n: '' }).trim())}`;
            tick();
        }

        function tick() {
            const el = document.getElementById('timer');
            if (state.running) {
                const left = state.endsAt - Date.now();
                el.textContent = fmtTime(left);
                el.className = 'timer ov-track' + (left <= 10000 ? ' hurry' : '');
            } else if (state.endedAt) {
                el.textContent = G.t('cm.ended');
                el.className = 'timer ov-track over';
            } else {
                el.textContent = '00:00';
                el.className = 'timer ov-track';
            }
        }
        setInterval(tick, 250);

        function showWinners(s) {
            const w = document.getElementById('winners');
            const top = (s.participants || []).slice(0, s.winners || 3);
            if (!top.length) return;
            const [first, ...others] = top;
            w.innerHTML = `<div class="wbox ov-surface"><h2>🏆 ${G.escapeHtml(G.t('cm.winners'))}</h2>
                <div class="first"><img src="${G.escapeHtml(G.avatarOf(first))}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">
                <div class="n">${G.escapeHtml(first.nickname || first.uniqueId)}</div><div class="c">🪙 ${G.formatNumber(first.coins)}</div></div>
                <div class="others">${others.map((p, i) => `<div>${['🥈', '🥉'][i] || `#${i + 2}`} ${G.escapeHtml(p.nickname || p.uniqueId)} — 🪙 ${G.formatNumber(p.coins)}</div>`).join('')}</div></div>`;
            w.classList.add('on');
            clearTimeout(winnersTimer);
            winnersTimer = setTimeout(() => w.classList.remove('on'), hold * 1000);
        }

        const socket = G.connect();
        socket.on('coinmatch_update', (s) => { if (s) { state = s; if (!s.endedAt) document.getElementById('winners').classList.remove('on'); render(); } });
        socket.on('coinmatch_end', (s) => { if (s) { state = s; render(); showWinners(s); } });
        if (G.token && !G.isDemo) {
            fetch(`/api/coinmatch/state?token=${encodeURIComponent(G.token)}`).then(r => r.json()).then(s => { if (s) { state = s; render(); } }).catch(() => { });
        }
        render();

        if (G.isDemo) {
            const people = ['Léa 🎮', 'Max', 'Sarah', 'Tom', 'Inès ✨', 'Hugo'].map((n, i) => ({ uniqueId: 'u' + i, nickname: n, profilePictureUrl: '/logo.png', coins: 0 }));
            state = { running: true, title: 'Coin Match', endsAt: Date.now() + 59000, participants: [], count: 0, winners: 3 };
            const step = () => {
                const p = people[Math.floor(Math.random() * people.length)];
                p.coins += 1 + Math.floor(Math.random() * 99);
                const active = people.filter(x => x.coins > 0).sort((a, b) => b.coins - a.coins);
                state = { ...state, participants: active, count: active.length };
                if (Date.now() > state.endsAt) {
                    state = { ...state, running: false, endedAt: Date.now() };
                    render(); showWinners(state);
                    setTimeout(() => { people.forEach(x => { x.coins = 0; }); state = { ...state, running: true, endedAt: null, endsAt: Date.now() + 59000, participants: [], count: 0 }; render(); }, hold * 1000);
                    return;
                }
                render();
            };
            setInterval(() => { if (state.running) step(); }, 1200);
        }
    </script>
</body>

</html>
