<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentok Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            /* CLÉ: Fond transparent pour OBS */
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            height: 100vh;
        }

        #container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            /* Hidden by default until data arrives */
            transform: translateY(20px);
        }

        #container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            font-weight: 600;
        }

        .username {
            font-size: 1.1rem;
            font-weight: 800;
            white-space: nowrap;
        }

        /* Avatar styling if available */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            display: none;
        }

        /* Type specific colors */
        .type-follower .icon-box {
            background: #fe2c55;
            color: white;
        }

        .type-gift .icon-box {
            background: #9b59b6;
            color: white;
        }

        .type-share .icon-box {
            background: #f1c40f;
            color: black;
        }

        .type-like .icon-box {
            background: #ff7675;
            color: white;
        }

        .type-subscriber .icon-box {
            background: #2ecc71;
            color: white;
        }

        .type-chat .icon-box {
            background: #3498db;
            color: white;
        }

        .gift-visual {
            display: none;
            align-items: center;
            gap: 5px;
            margin-left: 8px;
        }

        .gift-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255, 51, 153, 0.4));
        }

        .gift-multiplier {
            color: #ff3399;
            background: transparent;
            padding: 0;
            font-size: 1.4rem;
            font-weight: 900;
            margin-left: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 153, 0.6);
            font-style: italic;
        }
    </style>
    <meta name="referrer" content="no-referrer">
</head>

<body>

    <div id="container">
        <div class="icon-box" id="icon-box">
            <i class="fas fa-heart" id="icon"></i>
        </div>
        <img src="" class="avatar" id="avatar">

        <div class="content">
            <span class="label" id="label">DERNIER...</span>
            <span class="username" id="username">PSEUDO</span>
        </div>

        <div class="gift-visual" id="gift-visual">
            <img src="" class="gift-img" id="gift-img">
            <span class="gift-multiplier" id="gift-multiplier">x1</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('container');
        const usernameEl = document.getElementById('username');
        const labelEl = document.getElementById('label');
        const iconEl = document.getElementById('icon');
        const iconBox = document.getElementById('icon-box');
        const avatarEl = document.getElementById('avatar');
        const giftVisual = document.getElementById('gift-visual');
        const giftImg = document.getElementById('gift-img');
        const giftMultiplier = document.getElementById('gift-multiplier');

        // Determiné type from URL
        // Expected URL: /overlay/last-follower, /overlay/last-gifter, etc.
        const path = window.location.pathname;
        let type = 'follower';
        let labelText = 'DERNIER SUBSCRIBE';
        let iconClass = 'fa-heart';

        if (path.includes('follower')) {
            type = 'follower';
            labelText = 'DERNIER FOLLOWER';
            iconClass = 'fa-user-plus';
            container.classList.add('type-follower');
        } else if (path.includes('gifter')) {
            type = 'gift';
            labelText = 'DERNIER CADEAU';
            iconClass = 'fa-gift';
            container.classList.add('type-gift');
        } else if (path.includes('subscriber')) {
            type = 'subscriber';
            labelText = 'DERNIER ABONNÉ';
            iconClass = 'fa-star';
            container.classList.add('type-subscriber');
        } else if (path.includes('share')) {
            type = 'share';
            labelText = 'DERNIER PARTAGE';
            iconClass = 'fa-share';
            container.classList.add('type-share');
        } else if (path.includes('like')) {
            type = 'like';
            labelText = 'DERNIER LIKE';
            iconClass = 'fa-heart';
            container.classList.add('type-like');
        } else if (path.includes('chatter')) {
            type = 'chat';
            labelText = 'DERNIER MESSAGE';
            iconClass = 'fa-comment-dots';
            container.classList.add('type-chat');
        }

        labelEl.textContent = labelText;
        iconEl.className = `fas ${iconClass}`;

        function updateDisplay(data) {
            // Handle missing data: force PSEUDO
            if (!data) {
                usernameEl.textContent = 'PSEUDO';
                avatarEl.style.display = 'none';
                iconBox.style.display = 'flex';
                container.classList.add('visible');
                return;
            }

            // Handle different data structures
            let name = data.uniqueId || data.nickname || 'PSEUDO';
            if (name === 'Personne') name = 'PSEUDO';

            let avatarUrl = data.profilePictureUrl || data.avatar;

            usernameEl.textContent = name;

            if (avatarUrl) {
                avatarEl.src = avatarUrl;
                avatarEl.style.display = 'block';
                iconBox.style.display = 'none';
            } else {
                avatarEl.style.display = 'none';
                iconBox.style.display = 'flex';
            }

            // Handle Gift Specifics
            if (type === 'gift') {
                const iconObj = data.giftIcon || data.giftImage || {};
                const iconUrl = data.url || (iconObj.url_list ? iconObj.url_list[0] : (iconObj.url || ''));

                if (iconUrl) {
                    giftImg.src = iconUrl;
                    giftMultiplier.textContent = `x${data.repeatCount || 1}`;
                    giftVisual.style.display = 'flex';
                } else {
                    giftVisual.style.display = 'none';
                }
            } else {
                giftVisual.style.display = 'none';
            }

            container.classList.add('visible');

            // Optional: Animation trigger
            container.style.animation = 'none';
            container.offsetHeight; /* trigger reflow */
            container.style.animation = 'pulse 0.5s';
        }

        // 1. Initial Load
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('identify', { token: token, type: 'overlay' });
            // Show placeholder immediately
            container.classList.add('visible');
        });

        // 2. Receive Initial Data
        socket.on('initialLastEvents', (events) => {
            if (events && events[type]) {
                updateDisplay(events[type]);
            } else {
                updateDisplay(null);
            }
        });

        // 3. Receive Live Updates
        socket.on('lastEvent', (payload) => {
            if (payload.type === type) {
                updateDisplay(payload.data);
            }
            // For chatter, we might map 'chat' type to 'chatter' view
            if (type === 'chat' && payload.type === 'chat') {
                updateDisplay(payload.data);
            }
        });

        // [NEW] Support simulations via postMessage (for instant dashboard preview)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'simulation') {
                updateDisplay(event.data.data);
            }
        });

        socket.on('remote_reload', () => {
            window.location.reload();
        });

        function applyCustomFont(font) {
            if (!font) return;
            const googleFonts = ['Luckiest Guy', 'Outfit', 'Bebas Neue', 'Orbitron', 'Press Start 2P', 'Inter', 'Roboto', 'Fasthand'];
            const isGoogle = googleFonts.includes(font);

            if (isGoogle) {
                const fontId = 'google-font-' + font.replace(/ /g, '-').toLowerCase();
                if (!document.getElementById(fontId)) {
                    const link = document.createElement('link');
                    link.id = fontId;
                    link.rel = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/ /g, '+')}&display=swap`;
                    document.head.appendChild(link);
                }
                document.body.style.setProperty('font-family', `'${font}', cursive, sans-serif`, 'important');
            } else {
                const fontUrl = `https://gentok.fr/polices/${font}.ttf`;
                const fontFace = new FontFace(font, `url(${fontUrl})`);
                fontFace.load().then(loadedFace => {
                    document.fonts.add(loadedFace);
                    document.body.style.setProperty('font-family', `'${font}', sans-serif`, 'important');
                }).catch(err => {
                    console.error('Font load error:', err);
                    document.body.style.setProperty('font-family', `'${font}', sans-serif`, 'important');
                });
            }
        }

        const fontParam = urlParams.get('font');
        if (fontParam) applyCustomFont(fontParam);
    </script>
</body>

</html>
