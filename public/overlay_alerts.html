<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Alertes</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root { --accent: #fe2c55; }
        html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        .alert {
            display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
            color: #fff; max-width: 90vw; opacity: 0; transform: scale(.6) translateY(30px);
            transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.4, .4, 1);
        }
        .alert.show { opacity: 1; transform: scale(1) translateY(0); }
        .alert.hide { opacity: 0; transform: scale(.9) translateY(-20px); }
        .media { max-width: 60vw; max-height: 55vh; border-radius: 16px; filter: drop-shadow(0 8px 25px rgba(0,0,0,.6)); }
        .avatar-wrap { position: relative; }
        .avatar { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 5px solid var(--accent); box-shadow: 0 0 35px var(--accent); background: #222; }
        .badge { position: absolute; right: -10px; bottom: -6px; width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
        .title { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
        .name { font-size: 46px; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,.9); line-height: 1.1; word-break: break-word; }
        .sub { font-size: 28px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
        .sub b { color: var(--accent); }
        /* With a shared style (theme=...) the alert becomes a card */
        html[class*="ovt-"] .alert { padding: 24px 40px; }
        .custom-text { font-size: 38px; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,.9); word-break: break-word; }
    </style>
    <link rel="stylesheet" href="/overlay-themes.css">
</head>

<body>
    <div id="stage"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // URL parameters:
        //   events=follow,gift,subscribe,share,question  types d'alertes affichées (défaut : toutes)
        //   lang=fr|en|es|de|pt|it
        //   mingift=0      valeur minimale (pièces) d'un combo de cadeaux pour afficher une alerte
        //   duration=5     durée d'affichage en secondes
        //   actions=1      afficher aussi les actions "Alerte" (0 pour désactiver)
        //   screen=1       "écran" des actions (1 à 8) : chaque action choisit l'écran où elle s'affiche ; les alertes
        //                  TikTok (follow, cadeau...) ne s'affichent que sur l'écran 1, sauf si events=... est indiqué
        //   color=fe2c55   couleur principale, demo=1 pour un aperçu
        const G = window.Gentok;
        document.documentElement.style.setProperty('--accent', G.colorParam('color', '#fe2c55'));

        const screen = Math.min(Math.max(Math.round(G.numParam('screen', 1)), 1), 8);
        const enabledTypes = G.listParam('events', screen === 1 ? ['follow', 'gift', 'subscribe', 'share', 'question'] : []);
        const minGift = G.numParam('mingift', 0);
        const duration = Math.min(Math.max(G.numParam('duration', 5), 1), 60);
        const showActions = G.boolParam('actions', true);
        const stage = document.getElementById('stage');
        const queue = [];
        let busy = false;
        let current = null; // { end, skip }: the alert on screen

        const t = G.t;

        function buildTikTokAlert(type, d) {
            const name = G.escapeHtml(d.nickname || d.uniqueId || t('anonymous'));
            const avatar = G.safeUrl(d.profilePictureUrl) || '/logo.png';
            let sub = '';
            let badge = '';
            if (type === 'gift') {
                sub = `${t('did.gift')} <b>${G.escapeHtml(d.repeatCount || 1)}× ${G.escapeHtml(d.giftName || t('gift'))}</b>`;
                if (d.coins) sub += ` <span style="opacity:.8">(${G.formatNumber(d.coins)} 🪙)</span>`;
                const icon = G.safeUrl(d.giftIcon);
                if (icon) badge = `<img class="badge" src="${G.escapeHtml(icon)}">`;
            } else if (type === 'follow') sub = t('did.follow');
            else if (type === 'subscribe') sub = d.subMonth ? G.escapeHtml(t('did.subMonths', { n: d.subMonth })) : t('did.subscribe');
            else if (type === 'share') sub = t('did.share');
            else if (type === 'question') sub = `${t('did.question')} :<br><b>${G.escapeHtml(d.question || '')}</b>`;

            return `
                <div class="avatar-wrap"><img class="avatar" src="${G.escapeHtml(avatar)}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'">${badge}</div>
                <div class="title">${G.escapeHtml(t('alert.' + type))}</div>
                <div class="name">${name}</div>
                <div class="sub">${sub}</div>`;
        }

        function buildCustomAlert(d) {
            const url = G.safeUrl(d.mediaUrl);
            let media = '';
            if (url) {
                media = /\.(mp4|webm|mov)(\?|$)/i.test(url)
                    ? `<video class="media" src="${G.escapeHtml(url)}" autoplay playsinline></video>`
                    : `<img class="media" src="${G.escapeHtml(url)}" referrerpolicy="no-referrer">`;
            }
            return `${media}${d.text ? `<div class="custom-text">${G.escapeHtml(d.text)}</div>` : ''}`;
        }

        function enqueue(item) {
            if (queue.length > 30) queue.shift(); // never lag minutes behind the live
            queue.push(item);
            // "Passer à l'action suivante": the alert on screen ends as soon as another one is waiting
            if (current && current.skip) current.end();
            next();
        }

        function next() {
            if (busy || queue.length === 0) return;
            busy = true;
            const item = queue.shift();
            const el = document.createElement('div');
            el.className = 'alert ov-surface';
            if (item.fade === false) el.style.transition = 'none';
            el.innerHTML = item.html;
            stage.appendChild(el);
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

            const video = el.querySelector('video');
            const showMs = item.duration * 1000;
            let ended = false;
            const end = () => {
                if (ended) return;
                ended = true;
                clearTimeout(timer);
                current = null;
                el.classList.add('hide');
                if (video) video.pause();
                setTimeout(() => { el.remove(); busy = false; next(); }, item.fade === false ? 0 : 450);
            };
            const timer = setTimeout(end, showMs);
            current = { end, skip: !!item.skip };
            if (item.skip && queue.length) end();
        }

        function onTikTokAlert(payload) {
            if (!payload || !payload.type || !enabledTypes.includes(payload.type)) return;
            const d = payload.data || {};
            if (payload.type === 'gift' && (Number(d.coins) || 0) < minGift) return;
            enqueue({ html: buildTikTokAlert(payload.type, d), duration });
        }

        function onCustomAlert(d) {
            if (!showActions || !d || (Number(d.screen) || 1) !== screen) return;
            enqueue({ html: buildCustomAlert(d), duration: Math.min(Math.max(Number(d.duration) || duration, 1), 60), fade: d.fade !== false, skip: !!d.skipOnNext });
        }

        const socket = G.connect();
        socket.on('tiktok_alert', onTikTokAlert);
        socket.on('overlay_alert', onCustomAlert);

        if (G.isDemo) {
            const types = ['follow', 'gift', 'subscribe', 'share'];
            let i = 0;
            const demo = () => {
                const type = types[i++ % types.length];
                const data = { ...G.demoUser() };
                if (type === 'gift') Object.assign(data, { giftName: 'Rose', repeatCount: 5, coins: 5, giftIcon: '/img/tiktok/5655.png' });
                onTikTokAlert({ type, data });
            };
            demo();
            setInterval(demo, (duration + 1) * 1000);
        }
    </script>
</body>

</html>
