<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gentok - Points Drop</title>
    <meta name="referrer" content="no-referrer">
    <style>
        html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; }
        .banner { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -140%); padding: 10px 22px; border-radius: 999px; background: rgba(14,14,22,.9);
            border: 2px solid #fbbf24; box-shadow: 0 0 22px rgba(251,191,36,.5); font-weight: 900; font-size: 22px; white-space: nowrap; transition: transform .5s cubic-bezier(.2,1.3,.4,1); }
        .banner.show { transform: translate(-50%, 0); }
        .banner b { color: #fbbf24; }
        .banner small { margin-left: 10px; font-size: 16px; opacity: .85; font-variant-numeric: tabular-nums; }
        .coin { position: fixed; top: -50px; width: 34px; height: 34px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle at 35% 30%, #fff7cc, #fbbf24 40%, #b45309 100%); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.4);
            animation: fall linear forwards; }
        .coin::after { content: '★'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b45309; font-size: 16px; }
        .catch { position: fixed; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; animation: catch 2.4s ease-out forwards; }
        .catch img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #fbbf24; background: #222; }
        .catch span { font-weight: 900; font-size: 16px; text-shadow: 0 2px 4px #000; white-space: nowrap; }
        .catch b { color: #fbbf24; font-size: 18px; text-shadow: 0 2px 4px #000; }
        @keyframes fall { to { transform: translateY(calc(100vh + 100px)) rotate(540deg); } }
        @keyframes catch { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px); } }
    </style>
</head>

<body>
    <div class="banner" id="banner"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/overlay-common.js"></script>
    <script>
        // Points Drop : des pièces tombent, les spectateurs tapent le mot-clé (ex : !catch) pour gagner des points.
        // Lancez-le depuis Outils live > Giveaway & Points Drop. Conseil : source navigateur en 1920x1080.
        // URL parameters: coins=40 (pièces par seconde max), lang, font, demo=1
        const G = window.Gentok;
        const RATE = Math.min(Math.max(G.numParam('coins', 40), 5), 120);
        const banner = document.getElementById('banner');
        let state = { running: false };
        let rainTimer = null;

        function coin() {
            const c = document.createElement('div');
            c.className = 'coin';
            const s = 24 + Math.random() * 22;
            c.style.width = c.style.height = s + 'px';
            c.style.left = Math.random() * (window.innerWidth - s) + 'px';
            c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
            document.body.appendChild(c);
            c.addEventListener('animationend', () => c.remove());
        }

        function render() {
            if (state.running) {
                const left = Math.max(0, Math.ceil((state.endsAt - Date.now()) / 1000));
                banner.innerHTML = `🪙 ${G.escapeHtml(G.t('drop.type', { cmd: state.keyword, n: G.formatNumber(state.perViewer) })).replace(G.escapeHtml(state.keyword), `<b>${G.escapeHtml(state.keyword)}</b>`)}<small>${left}s · ${state.catchers.length}/${state.maxCatchers}</small>`;
                banner.classList.add('show');
                if (!rainTimer) rainTimer = setInterval(() => { for (let i = 0; i < RATE / 10; i++) coin(); }, 100);
            } else {
                banner.classList.remove('show');
                clearInterval(rainTimer); rainTimer = null;
            }
        }
        setInterval(() => { if (state.running) render(); }, 500);

        function showCatch(c) {
            const el = document.createElement('div');
            el.className = 'catch';
            el.style.left = (40 + Math.random() * (window.innerWidth - 160)) + 'px';
            el.style.top = (window.innerHeight * (0.35 + Math.random() * 0.4)) + 'px';
            el.innerHTML = `<img src="${G.escapeHtml(G.avatarOf(c))}" referrerpolicy="no-referrer" onerror="this.src='/logo.png'"><span>${G.escapeHtml(c.nickname)}</span><b>+${G.formatNumber(c.points)}</b>`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        const socket = G.connect();
        socket.on('pointsdrop_update', (s) => { if (s) { state = s; render(); } });
        socket.on('pointsdrop_catch', (s) => { if (s) { state = s; render(); if (s.catcher) showCatch(s.catcher); } });

        if (G.isDemo) {
            const start = () => { state = { running: true, keyword: '!catch', perViewer: 100, maxCatchers: 10, endsAt: Date.now() + 15000, catchers: [] }; render(); };
            start();
            setInterval(() => {
                if (!state.running) return;
                if (Date.now() > state.endsAt || state.catchers.length >= state.maxCatchers) { state = { ...state, running: false }; render(); setTimeout(start, 3000); return; }
                const c = { ...G.demoUser(), points: 100 };
                state = { ...state, catchers: [...state.catchers, c] };
                showCatch(c); render();
            }, 1300);
        }
    </script>
</body>

</html>
