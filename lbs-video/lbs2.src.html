<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBS Work - Promo v2</title>
<style>
@font-face{font-family:IB;src:url(data:font/otf;base64,{{F_BLACK}})}
@font-face{font-family:IX;src:url(data:font/otf;base64,{{F_XBOLD}})}
@font-face{font-family:IM;src:url(data:font/otf;base64,{{F_MED}})}
:root{--purple:#5E2D61;--deep:#34123F;--lilac:#DDB8FF;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--purple);transform-origin:0 0}
.abs{position:absolute;white-space:nowrap}
.sc{position:absolute;inset:0;overflow:hidden}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:10px 16px;background:#000c;color:#fff;font:14px sans-serif;align-items:center}
#ctl input{flex:1}
body.render #ctl{display:none}
</style></head><body>
<div id="stage"></div>
<div id="ctl"><button id="pb">Play ▶</button><input id="sc" type="range" min="0" max="1000" value="0"><span id="tc"></span></div>
<script>
/* ===== LBS WORK promo v2 — 9:16, 128 BPM, 76 beats = 35.6 s. Style modelled on the client's reference video.
 beat  scene
  0  S1 SOGNI DI LAVORARE IN GERMANIA? + flags
  8  S2 logo ring + "LAVORO BUSINESS E SERVIZI"
 16  S3 METTIAMO IN CONTATTO aziende tedesche e lavoratori europei (network)
 24  S4 COLLABORIAMO CON GRANDI AZIENDE TEDESCHE + settore chips
 32  S5 CI OCCUPIAMO DELLE TRADUZIONI (IT -> DE documents)
 40  S6 TI SEGUIAMO 24/24 + route Italia -> Germania, "per sempre"
 48  S7 NON SOLO ASSISTENZA / UN COMPAGNO AL TUO FIANCO
 56  S8 Piu di 350 italiani hanno gia scelto la Germania (white)
 64  S9 E TU COSA ASPETTI? + contatti
 Between scenes: diagonal white-strip / deep-purple wipe (0.35 s cover, 0.4 s reveal) */
const W=1080,H=1920,BPM=128,B=60/BPM,TOTAL=76,DUR=TOTAL*B;
window.VIDEO={w:W,h:H,duration:DUR};
const bt=n=>n*B;
function spring(t,w=14,z=0.82){if(t<=0)return 0;if(z>=1)return 1-Math.exp(-w*t)*(1+w*t);const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>(x=clamp(x),1-Math.pow(1-x,3));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rng=s=>()=>(s=(s+0x6D2B79F5)|0,s=Math.imul(s^(s>>>15),1|s),s^=s+Math.imul(s^(s>>>7),61|s),((s^(s>>>14))>>>0)/4294967296);
const stage=document.getElementById('stage');
const LOGO='data:image/png;base64,{{LOGO}}';
const NS='http://www.w3.org/2000/svg';
function mk(parent,css='',text='',cls='abs'){const d=document.createElement('div');d.className=cls;d.style.cssText=css;if(text)d.textContent=text;parent.appendChild(d);return d;}
function tx(parent,text,o){ // centred text block, pops via set()
  const d=mk(parent,`left:${o.x??0}px;top:${o.y}px;width:${o.w??W}px;text-align:${o.align||'center'};font:${o.size}px/1.05 ${o.font||'IB'};color:${o.color||'#fff'};letter-spacing:${o.ls??-1}px;transform-origin:50% 60%;opacity:0;`,text);
  if(o.deco)d.style.textDecoration=o.deco;
  d.set=(p,dy=40)=>{d.style.opacity=clamp(p*3);d.style.transform=`translateY(${(1-p)*dy}px) scale(${.7+.3*p})`;};
  return d;
}
const POP=(t,t0,w=16,z=.55)=>spring(t-t0,w,z);

// ---------- background pattern (icons) ----------
(function(){
  const c=document.createElement('canvas');c.width=860;c.height=860;const g=c.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.17)';g.lineWidth=5;g.lineJoin='round';g.lineCap='round';
  const R=rng(5);
  const icons={
    case(){g.beginPath();g.roundRect(-40,-22,80,56,10);g.moveTo(-14,-22);g.lineTo(-14,-32);g.lineTo(14,-32);g.lineTo(14,-22);g.moveTo(-40,4);g.lineTo(40,4);g.stroke();},
    truck(){g.beginPath();g.roundRect(-46,-26,54,42,6);g.moveTo(8,-14);g.lineTo(30,-14);g.lineTo(46,4);g.lineTo(46,16);g.lineTo(8,16);g.closePath();g.stroke();
      [-22,26].forEach(x=>{g.beginPath();g.arc(x,20,8,0,6.29);g.fillStyle='#5E2D61';g.fill();g.stroke();});},
    pizza(){g.beginPath();g.moveTo(-32,-34);g.lineTo(32,-34);g.lineTo(0,40);g.closePath();g.stroke();g.beginPath();g.moveTo(-36,-38);g.lineTo(36,-38);g.stroke();
      [[-8,-14],[10,-10],[0,10]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,5,0,6.29);g.stroke();});},
    hat(){g.beginPath();g.moveTo(-30,12);g.bezierCurveTo(-50,12,-50,-20,-22,-20);g.bezierCurveTo(-20,-42,20,-42,22,-20);g.bezierCurveTo(50,-20,50,12,30,12);g.closePath();g.stroke();
      g.beginPath();g.roundRect(-30,12,60,24,6);g.stroke();}
  };
  const names=['case','truck','pizza','hat'];
  const place=(row,col,ofs,name)=>{const x=(col*215+ofs)%860,y=row*215+107;
    [-860,0,860].forEach(dx=>{g.save();g.translate(x+dx,y);g.rotate((R()-.5)*.5);icons[name]();g.restore();});};
  let k=0;for(let r=0;r<4;r++)for(let q=0;q<4;q++){place(r,q,r%2?107:0,names[(q+r*3+(r>1?1:0))%4]);}
  stage.style.backgroundImage=`url(${c.toDataURL()})`;stage.style.backgroundSize='860px 860px';
})();

// ---------- reusable art ----------
function flag(parent,kind,css){
  const f=mk(parent,`width:190px;height:128px;border-radius:20px;overflow:hidden;border:6px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.25);${css}`);
  if(kind==='it'){[['#009246',0],['#fff',1],['#CE2B37',2]].forEach(([c,i])=>mk(f,`left:${i*33.3}%;top:0;width:34%;height:100%;background:${c};`));}
  else{[['#000',0],['#DD0000',1],['#FFCE00',2]].forEach(([c,i])=>mk(f,`left:0;top:${i*33.3}%;width:100%;height:34%;background:${c};`));}
  return f;
}
function svg(parent,css,vb,inner){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',vb);s.style.cssText='position:absolute;overflow:visible;'+css;s.innerHTML=inner;parent.appendChild(s);return s;}
const personSVG='<circle cx="50" cy="34" r="17" fill="#5E2D61"/><path d="M18 88 C18 62 34 54 50 54 C66 54 82 62 82 88 Z" fill="#5E2D61"/>';
const buildSVG='<rect x="26" y="14" width="48" height="74" rx="5" fill="#5E2D61"/>'+[0,1,2].map(r=>[0,1].map(c=>`<rect x="${34+c*20}" y="${24+r*18}" width="10" height="10" rx="2" fill="#fff"/>`).join('')).join('')+'<rect x="43" y="72" width="14" height="16" fill="#fff"/>';
const heartPath='M50 88 C10 56 6 30 26 18 C40 10 50 22 50 30 C50 22 60 10 74 18 C94 30 90 56 50 88 Z';

// ---------- scenes ----------
const SC=[0,8,16,24,32,40,48,56,64].map(bt),SE=[...SC.slice(1),DUR];
const S=[];function scene(bgc){const d=mk(stage,'inset:0;','','sc');if(bgc)d.style.background=bgc;S.push(d);return d;}

/* S1 */
const s1=scene();
const s1a=tx(s1,'SOGNI DI',{y:560,size:140}),s1b=tx(s1,'LAVORARE',{y:710,size:140}),s1c=tx(s1,'IN GERMANIA?',{y:880,size:128,color:'#DDB8FF'});
const s1f1=flag(s1,'it','left:250px;top:1180px;'),s1f2=flag(s1,'de','left:640px;top:1180px;');
const s1dot=mk(s1,'left:517px;top:1232px;width:46px;height:46px;border-radius:23px;background:#DDB8FF;');
function up1(t){s1a.set(POP(t,.25));s1b.set(POP(t,.65));s1c.set(POP(t,1.05));
  s1f1.style.transform=`scale(${POP(t,1.7,14,.5)}) rotate(${(1-POP(t,1.7,14,.5))*-12}deg)`;
  s1f2.style.transform=`scale(${POP(t,1.9,14,.5)}) rotate(${(1-POP(t,1.9,14,.5))*12}deg)`;
  const d=POP(t,2.1,14,.5);s1dot.style.transform=`scale(${d*(1+.15*Math.sin(t*8))})`;}

/* S2 */
const s2=scene();
const ringSvg=svg(s2,'left:0;top:0;width:1080px;height:1920px;','0 0 1080 1920','<circle id="r1" cx="540" cy="760" r="350" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" transform="rotate(-90 540 760)"/><circle id="r2" cx="540" cy="760" r="378" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="rotate(-90 540 760)"/>');
const r1=ringSvg.querySelector('#r1'),r2=ringSvg.querySelector('#r2');
const s2logo=mk(s2,`left:260px;top:480px;width:560px;height:560px;border-radius:50%;background:url(${LOGO}) center/contain no-repeat;`);
const s2t=tx(s2,'LAVORO BUSINESS E SERVIZI',{y:1210,size:50,font:'IX',ls:6});
const s2u=tx(s2,'La tua agenzia per il lavoro in Germania',{y:1300,size:42,font:'IM',ls:0,color:'#F3E6FF'});
function up2(t){const l1=2199,l2=2375;
  r1.setAttribute('stroke-dasharray',l1);r1.setAttribute('stroke-dashoffset',l1*(1-easeOut(seg(t,.15,1.0))));
  r2.setAttribute('stroke-dasharray',l2);r2.setAttribute('stroke-dashoffset',l2*(1-easeOut(seg(t,.35,1.2))));
  const p=POP(t,.7,13,.55);s2logo.style.transform=`scale(${p})`;s2logo.style.opacity=clamp(p*4);
  s2t.set(POP(t,1.3,14,.8),30);s2u.set(POP(t,1.75,14,.8),30);}

/* S3 network */
const s3=scene();
const s3a=tx(s3,'METTIAMO IN CONTATTO',{y:380,size:80}),s3b=tx(s3,'AZIENDE TEDESCHE',{y:490,size:98,color:'#DDB8FF'}),s3c=tx(s3,'E LAVORATORI EUROPEI',{y:640,size:80});
const netSvg=svg(s3,'left:0;top:0;width:1080px;height:1920px;','0 0 1080 1920','');
const wk=[1050,1290,1530],cp=[];
const pathsEl=[];const nodes=[];
function node(cx,cy,inner,css){const n=mk(s3,`left:${cx-65}px;top:${cy-65}px;width:130px;height:130px;border-radius:65px;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25);`);
  svg(n,'left:15px;top:15px;width:100px;height:100px;','0 0 100 100',inner);return n;}
const wn=wk.map(y=>node(190,y,personSVG)),cn=wk.map(y=>node(890,y,buildSVG));
const hub=mk(s3,`left:440px;top:1190px;width:200px;height:200px;border-radius:100px;background:url(${LOGO}) center/contain no-repeat;border:0;box-shadow:0 0 0 8px #fff;`);
const mkpath=(x1,y1,x2,y2)=>{const p=document.createElementNS(NS,'path');const mx=(x1+x2)/2;p.setAttribute('d',`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','rgba(255,255,255,.45)');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');netSvg.appendChild(p);return p;};
const wp=wk.map(y=>mkpath(255,y,440,1290)),cpa=wk.map(y=>mkpath(640,1290,825,y));
const dots=[];for(let i=0;i<6;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r','12');c.setAttribute('fill','#DDB8FF');netSvg.appendChild(c);dots.push(c);}
function up3(t){s3a.set(POP(t,.2),30);s3b.set(POP(t,.55),30);s3c.set(POP(t,.95),30);
  wn.forEach((n,i)=>n.style.transform=`scale(${POP(t,1.2+i*.12,14,.55)})`);
  cn.forEach((n,i)=>n.style.transform=`scale(${POP(t,1.7+i*.12,14,.55)})`);
  hub.style.transform=`scale(${POP(t,1.5,13,.5)*(1+.04*Math.sin(t*9))})`;
  [...wp,...cpa].forEach((p,i)=>{const L=p.getTotalLength();const st=1.35+(i%3)*.12+(i>2?.5:0);p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L*(1-easeOut(seg(t,st,st+.5))));});
  dots.forEach((c,i)=>{const p=(i<3?wp[i]:cpa[i-3]);const L=p.getTotalLength();const k=((t*.6+i*.17)%1);const act=t>(i<3?2.0:2.4);const pt=p.getPointAtLength(k*L);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('opacity',act?1:0);});}

/* S4 chips */
const s4=scene();
const s4a=tx(s4,'COLLABORIAMO CON',{y:420,size:84}),s4b=tx(s4,'GRANDI AZIENDE',{y:540,size:106,color:'#DDB8FF'}),s4c=tx(s4,'TEDESCHE',{y:680,size:140});
const chipT=['RISTORAZIONE','CONSEGNE','PIZZERIE','CUCINA','LOGISTICA'],chipPos=[[130,1030,-4],[590,1060,3],[190,1200,2],[600,1230,-3],[340,1380,-2]];
const chips=chipT.map((c,i)=>mk(s4,`left:${chipPos[i][0]}px;top:${chipPos[i][1]}px;padding:0 44px;height:104px;border-radius:52px;background:#fff;color:#5E2D61;font:40px/104px IX;letter-spacing:1px;box-shadow:0 12px 26px rgba(0,0,0,.25);`,c));
function up4(t){s4a.set(POP(t,.2),30);s4b.set(POP(t,.55),30);s4c.set(POP(t,.95),30);
  chips.forEach((c,i)=>{const p=POP(t,1.5+i*.22,14,.5);c.style.transform=`scale(${p}) rotate(${chipPos[i][2]*p}deg) translateY(${Math.sin(t*3+i)*6}px)`;c.style.opacity=clamp(p*3);});}

/* S5 translations */
const s5=scene();
const s5a=tx(s5,'CI OCCUPIAMO DELLE',{y:430,size:66,color:'#DDB8FF'}),s5b=tx(s5,'TRADUZIONI',{y:520,size:144});
function doc(x,label){const d=mk(s5,`left:${x}px;top:850px;width:380px;height:520px;border-radius:40px;background:#fff;box-shadow:0 24px 50px rgba(0,0,0,.3);`);
  mk(d,'left:34px;top:34px;width:92px;height:56px;border-radius:28px;background:#5E2D61;color:#fff;font:34px/56px IX;text-align:center;',label);
  const ls=[];for(let i=0;i<6;i++){mk(d,`left:34px;top:${130+i*62}px;width:${i%3===2?200:312}px;height:22px;border-radius:11px;background:#EBDDF1;`);
    ls.push(mk(d,`left:34px;top:${130+i*62}px;width:0;height:22px;border-radius:11px;background:#5E2D61;`));}
  return{d,ls};}
const dA=doc(100,'IT'),dB=doc(600,'DE');
const arrow=svg(s5,'left:480px;top:1070px;width:120px;height:80px;','0 0 120 80','<path d="M10 40 H100 M70 10 L104 40 L70 70" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>');
const chk=mk(s5,'left:900px;top:790px;width:120px;height:120px;border-radius:60px;background:#2ECC71;box-shadow:0 10px 26px rgba(0,0,0,.3);');
svg(chk,'left:28px;top:34px;width:64px;height:52px;','0 0 64 52','<path d="M6 28 L24 44 L58 8" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>');
function up5(t){s5a.set(POP(t,.2),30);s5b.set(POP(t,.5),30);
  dA.d.style.transform=`translateX(${(1-POP(t,.9,13,.8))*-700}px) rotate(${-4}deg)`;
  dB.d.style.transform=`translateX(${(1-POP(t,1.1,13,.8))*700}px) rotate(${4}deg)`;
  arrow.style.opacity=seg(t,1.5,1.7);arrow.style.transform=`translateX(${Math.sin(t*8)*8}px)`;
  const widths=[312,312,200,312,312,200];
  dB.ls.forEach((l,i)=>l.style.width=widths[i]*easeOut(seg(t,1.8+i*.22,2.1+i*.22))+'px');
  const c=POP(t,3.2,14,.5);chk.style.transform=`scale(${c})`;}

/* S6 24/24 route */
const s6=scene();
const s6a=tx(s6,'TI SEGUIAMO',{y:430,size:84}),s6b=tx(s6,'24/24',{y:560,size:300,color:'#fff'});
const rsvg=svg(s6,'left:0;top:0;width:1080px;height:1920px;','0 0 1080 1920','<path id="arc" d="M210 1500 Q540 1000 870 1500" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="6" stroke-dasharray="4 20" stroke-linecap="round"/>');
const arc=rsvg.querySelector('#arc');const mover=mk(s6,'left:0;top:0;width:70px;height:70px;border-radius:35px;background:#fff;box-shadow:0 0 0 12px rgba(255,255,255,.25);');
svg(mover,'left:14px;top:16px;width:42px;height:38px;','0 0 42 38','<path d="M2 4 L40 19 L2 34 L10 19 Z" fill="#5E2D61"/>');
const f6a=flag(s6,'it','left:135px;top:1530px;width:150px;height:100px;'),f6b=flag(s6,'de','left:795px;top:1530px;width:150px;height:100px;');
const l6a=tx(s6,'ITALIA',{x:110,w:200,y:1655,size:36,font:'IX',ls:2}),l6b=tx(s6,'GERMANIA',{x:740,w:300,y:1655,size:36,font:'IX',ls:2});
const s6c=tx(s6,'per sempre',{y:1750,size:60,font:'IM',color:'#DDB8FF',ls:0});
function up6(t){s6a.set(POP(t,.2),30);const p=POP(t,.55,12,.5);s6b.style.opacity=clamp(p*3);s6b.style.transform=`scale(${.6+.4*p})`;
  f6a.style.transform=`scale(${POP(t,1.0,14,.5)})`;l6a.set(POP(t,1.1));
  const L=arc.getTotalLength();const k=ease(seg(t,1.3,3.3));
  const pt=arc.getPointAtLength(k*L);const pt2=arc.getPointAtLength(Math.min(L,k*L+4));
  const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
  mover.style.transform=`translate(${pt.x-35}px,${pt.y-35}px) rotate(${ang}deg)`;mover.style.opacity=t>1.3?1:0;
  arc.setAttribute('stroke-dashoffset',String(-t*40));arc.setAttribute('opacity',seg(t,1.0,1.4));
  f6b.style.transform=`scale(${POP(t,3.2,14,.5)})`;l6b.set(POP(t,3.3));s6c.set(POP(t,3.5,14,.8),20);}

/* S7 companion */
const s7=scene();
const s7a=tx(s7,'NON SOLO ASSISTENZA',{y:420,size:68,color:'#C9A6E6',deco:'line-through'});
const ppl=mk(s7,'left:0;top:0;width:1080px;height:1920px;');
const pA=mk(ppl,'left:300px;top:640px;width:260px;height:300px;'),pB=mk(ppl,'left:520px;top:640px;width:260px;height:300px;');
[pA,pB].forEach(p=>svg(p,'left:0;top:0;width:260px;height:300px;','0 0 100 100',personSVG.replace(/#5E2D61/g,'#fff')));
const heart=svg(s7,'left:480px;top:700px;width:120px;height:120px;','0 0 100 100',`<path d="${heartPath}" fill="#DDB8FF"/>`);
const s7b=tx(s7,'UN COMPAGNO',{y:1070,size:112}),s7c=tx(s7,'AL TUO FIANCO',{y:1200,size:112,color:'#DDB8FF'});
function up7(t){s7a.set(POP(t,.2),30);
  pA.style.transform=`translateX(${(1-POP(t,.6,12,.65))*-500}px)`;pB.style.transform=`translateX(${(1-POP(t,.7,12,.65))*500}px)`;
  const h=POP(t,1.4,14,.45);heart.style.transform=`scale(${h*(1+.12*Math.sin(Math.max(0,t-1.6)*9))})`;
  s7b.set(POP(t,1.2),30);s7c.set(POP(t,1.6),30);}

/* S8 counter (white) */
const s8=scene('#FFFFFF');
const s8a=tx(s8,'Più di',{y:560,size:70,font:'IM',color:'#5E2D61',ls:0}),s8n=tx(s8,'0',{y:650,size:420,color:'#5E2D61',ls:-8});
const s8b=tx(s8,'ITALIANI HANNO GIÀ',{y:1140,size:74,color:'#5E2D61'}),s8c=tx(s8,'SCELTO LA GERMANIA',{y:1230,size:74,color:'#5E2D61'});
const s8h=svg(s8,'left:480px;top:1420px;width:120px;height:120px;','0 0 100 100',`<path d="${heartPath}" fill="#5E2D61"/>`);
function up8(t){s8a.set(POP(t,.2),20);s8n.style.opacity=clamp(seg(t,.35,.45));
  const v=Math.round(350*easeOut(seg(t,.4,2.0)));s8n.textContent=v;s8n.style.transform=`scale(${1+.04*(1-seg(t,2.0,2.4))})`;
  s8b.set(POP(t,1.3),30);s8c.set(POP(t,1.55),30);s8h.style.transform=`scale(${POP(t,2.0,14,.45)*(1+.1*Math.sin(Math.max(0,t-2.2)*9))})`;}

/* S9 end */
const s9=scene();

const s9a=tx(s9,'E TU COSA',{y:630,size:112}),s9b=tx(s9,'ASPETTI?',{y:750,size:112,color:'#DDB8FF'});

const TILT=240,STRIP=80;
function edge(e){return [[0,e+TILT/2],[W,e-TILT/2]];} // left lower, right higher
function wipe(t){
  let dark='none',white='none';
  for(let k=1;k<9;k++){const Tc=SC[k];
    if(t>=Tc-.38&&t<Tc){const p=ease(seg(t,Tc-.38,Tc));const e=lerp(H+400,-300,p);const [a,b]=edge(e);

    else if(t>=Tc&&t<Tc+.42){const p=ease(seg(t,Tc,Tc+.42));const e=lerp(H+400,-300,p);const [a,b]=edge(e);

}

};

// ---------- audio ----------
window.buildAudio=async function(ctx){
  const sr=ctx.sampleRate,master=ctx.createGain();master.gain.value=.9;
  const lim=ctx.createDynamicsCompressor();lim.threshold.value=-10;lim.ratio.value=8;master.connect(lim);lim.connect(ctx.destination);
  const R=rng(777),nb=ctx.createBuffer(1,sr*3,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
  const nz=(t,d,type,f,g,f2)=>{const s=ctx.createBufferSource();s.buffer=nb;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=.9;const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+Math.min(.01,d/3));gn.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t,R()*1.5);s.stop(t+d+.05);};
  const tone=(t,d,type,f,g,f2,lp)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.5);const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.006);gn.gain.exponentialRampToValueAtTime(.0008,t+d);let n=o;if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl;}n.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.05);};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const pop=(t,f=700)=>{tone(t,.12,'sine',f,.22,f*1.8);nz(t,.03,'highpass',5000,.08);};
  const whoosh=(t,d=.45)=>nz(t,d,'bandpass',500,.3,6000);
  const chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
  for(let b=0;b<TOTAL;b++){
    const t=bt(b);
    if(b>=2){tone(t,.3,'sine',150,.9,42);nz(t,.03,'highpass',3000,.14);}
    if(b>=4&&(b%4===1||b%4===3)){nz(t,.16,'bandpass',1800,.3);nz(t,.1,'highpass',5000,.1);}
    if(b>=4){nz(t+B/2,.05,'highpass',7500,.12);}
    const bar=Math.floor(b/4)%4,ch=chords[bar];
    if(b>=4)tone(t+B/2,B*.45,'sawtooth',mtof(ch[0]-24+(b%2?0:12)),.17,null,320);
    if(b>=2)[0,1,2,3].forEach(k=>{const n=ch[(k+b)%3]+(k%2?12:24);tone(t+k*B/4,.2,'triangle',mtof(n),.07,null,3800);});
    if(b%4===0)ch.forEach(n=>tone(t,B*4,'sine',mtof(n),.04));
  }
  // wipes
  for(let k=1;k<9;k++){const Tc=SC[k];whoosh(Tc-.4,.8);tone(Tc,.7,'sine',100,.8,30);nz(Tc,.35,'lowpass',2500,.35,200);}
  // pops (local times per scene, matching visuals)
  const P=[[.25,.65,1.05,1.7,1.9],[.7,1.3,1.75],[.2,.55,.95,1.2,1.32,1.44,1.7,1.82,1.94],[.2,.55,.95,1.5,1.72,1.94,2.16,2.38],[.2,.5,.9,1.1,3.2],[.2,.55,1.0,3.2,3.5],[.2,.6,.7,1.2,1.4,1.6],[.2,1.3,1.55,2.0],[.2,.55,.85,1.3,1.6,1.9,2.5]];
  P.forEach((arr,k)=>arr.forEach((o,i)=>pop(SC[k]+o,520+((i*3)%5)*110)));
  // counter ticks
  for(let i=0;i<14;i++)tone(SC[7]+.4+i*.115,.05,'square',900+i*70,.05,null,3000);
  // final chime
  [880,1318.5,1760].forEach((f,i)=>tone(SC[8]+2.6+i*.08,2.4,'sine',f,.08));
  master.gain.setValueAtTime(.9,DUR-1.1);master.gain.linearRampToValueAtTime(0,DUR);
};
