<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBS per le Aziende</title>
<style>
@font-face{font-family:PJS;src:url(data:font/woff2;base64,{{PJS}}) format('woff2');font-weight:200 800}
@font-face{font-family:INT;src:url(data:font/woff2;base64,{{INTER}}) format('woff2');font-weight:100 900}
:root{--p:#5e2d61;--l:#dab6fc;--d:#30103d;--g:#2fbf6b;--r:#ff5a6e;--y:#ffc542}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#5e2d61;transform-origin:0 0;font-family:INT}
#bg{position:absolute;left:0;top:0}
#glow{position:absolute;left:-200px;top:-150px}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:960px 560px}
.a{position:absolute;white-space:nowrap}
.ctr{transform:translate(-50%,-50%)}
.h1{font-family:PJS;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:#fff}
.lbl{font-family:INT;font-weight:800;text-transform:uppercase;letter-spacing:.2em}
.li{color:var(--l)}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:.16em .04em .1em;margin:-.16em -.04em -.1em}
.mi{display:inline-block}
.card{position:absolute;border-radius:28px;background:#fff;box-shadow:0 24px 50px rgba(25,4,35,.38);color:#30103d}
.cc{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.pill{position:absolute;padding:14px 28px;border-radius:999px;background:#fff;color:var(--p);font:800 26px/1 INT;letter-spacing:.04em;box-shadow:0 12px 26px rgba(25,4,35,.3);display:flex;align-items:center;gap:12px;white-space:nowrap}
.hl{position:relative;display:inline-block}
.hl>i{position:absolute;left:-.12em;right:-.12em;top:.04em;bottom:-.02em;background:var(--l);transform-origin:0 50%;transform:scaleX(0);border-radius:.12em}
.hl>b{position:relative;font-weight:inherit}
.row{position:absolute;left:0;width:100%;display:flex;align-items:center;gap:22px;padding:0 34px}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn{flex:none;margin-left:auto;padding:14px 26px;border-radius:12px;font:800 24px/1 INT;display:flex;align-items:center;gap:10px}
.bub{position:absolute;padding:18px 24px;border-radius:24px;font:600 26px/1.35 INT;white-space:nowrap}
.fld{position:absolute;left:44px;right:44px;height:92px;border-radius:16px;border:3px solid #ece4f1;background:#faf7fc;display:flex;align-items:center;padding:0 26px;font:600 32px INT;color:#30103d}
.flb{position:absolute;left:46px;font:800 20px INT;letter-spacing:.14em;text-transform:uppercase;color:#9a83a6}
.caret{display:inline-block;width:3px;height:1.05em;background:#5e2d61;margin-left:3px;vertical-align:-.15em}
.chk{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2fbf6b;box-shadow:0 10px 24px rgba(20,90,50,.35);transform:translate(-50%,-50%)}
.no{background:#ff5a6e;box-shadow:0 10px 24px rgba(120,20,40,.35)}
.wbar{position:absolute;top:-140px;width:4400px;height:1360px;transform-origin:0 0;visibility:hidden}
#hud{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.tab{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;font:700 19px/1 INT;color:#fff;background:rgba(255,255,255,.1);white-space:nowrap}
.tab b{display:flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:rgba(255,255,255,.18);font:800 16px INT}
#grain{position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;background-size:256px 256px;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(20,0,30,.3) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:10px 16px;background:#000c;color:#fff;font:14px sans-serif;align-items:center}
#ctl input{flex:1}
body.render #ctl{display:none}
svg{overflow:visible}
</style></head><body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="glow" width="2320" height="1380"></canvas>
  <div id="scenes"></div>
  <div id="hud"></div>
  <div class="wbar" id="wb0" style="background:#dab6fc"></div>
  <div class="wbar" id="wb1" style="background:#ffffff"></div>
  <div class="wbar" id="wb2" style="background:#30103d"></div>
  <div id="grain"></div><div id="vig"></div><div id="fade"></div>
</div>
<div id="ctl"><button id="pb">Play ▶</button><input id="sc" type="range" min="0" max="1000" value="0"><span id="tc"></span></div>
<script>
/* ===== LBS — "Datori di lavoro": video per le aziende in Germania — 16:9 1920x1080, voce + musica 116 BPM (Sol maggiore) =====
 Stesso impianto della guida collaboratori: ogni scena resta per tutta la frase; a ogni punto la voce si ferma 1.6 s sulla scheda.
 τ = tempo della voce. Pause: 36.85 (selezione), 53.6 (burocrazia), 62.15 (assistenza), 75.35 (costo zero), 92.5 (come iniziare), 120.5 (contatti).
 0     "Buongiorno!" azienda in Germania           4.8   il problema: annunci senza risposta, candidati assenti, burocrazia
 16.9  "Noi siamo LBS": 11 anni, 350+, 200+         30.5  sedi Kassel / Catania, i 3 punti
 38.75 selezione: imbuto candidati -> profili verificati      47.3 settori + "diteci chi cercate"
 55.45 burocrazia: documenti nella cartella, traduzioni IT->DE      64.2 assistenza 24/7, viaggio/alloggio/medico/banca
 77.65 0 € gratis al 100%                          86.9  contratto regolare secondo la legge tedesca
 94.8  4 passi (modulo/WhatsApp, profilo, colloquio, partenza)      120.5 contatti      144.4 chiusura */
const W = 1920, H = 1080, O = 0.5;
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const eIn = x => (x = clamp(x), x * x * x);
const expo = x => (x = clamp(x), x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const $ = id => document.getElementById(id);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function tf(el, { x = 0, y = 0, s = 1, r = 0, o, b = 0, c = false } = {}) {
  let tr = (c ? 'translate(-50%,-50%) ' : '') + `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
  if (s !== 1) tr += ` scale(${s.toFixed(4)})`;
  if (r) tr += ` rotate(${r.toFixed(2)}deg)`;
  el.style.transform = tr;
  if (o !== undefined) { el.style.opacity = o; el.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
  el.style.filter = b > 0.08 ? `blur(${b.toFixed(2)}px)` : 'none';
}
const rise = (el, t, t0, { d = .6, dy = 40, c = false, x = 0 } = {}) => { const k = eOut(seg(t, t0, t0 + d)); tf(el, { x, y: (1 - k) * dy, o: k, b: (1 - k) * 6, c }); return k; };
const pop = (el, t, t0, { c = false, from = .4, w = 13, z = .66, x = 0, y = 0, r0 = 0 } = {}) => { const k = spring(t - t0, w, z); tf(el, { x, y, s: Math.max(0, lerp(from, 1, k)), r: r0 * (1 - k), o: clamp((t - t0) * 6), c }); return k; };
const slideIn = (el, t, t0, { dx = 120, d = .7, c = false } = {}) => { const k = expo(seg(t, t0, t0 + d)); tf(el, { x: (1 - k) * dx, o: clamp((t - t0) / .25), b: (1 - k) * 8, c }); return k; };
function words(el, t, times, d = .6) {
  $$('.mi', el).forEach((w, i) => {
    const t0 = Array.isArray(times) ? times[Math.min(i, times.length - 1)] : times + i * .09;
    w.style.transform = `translateY(${((1 - expo(seg(t, t0, t0 + d))) * 135).toFixed(2)}%)`;
  });
}
const hl = (el, t, t0, d = .45) => { el.querySelector('i').style.transform = `scaleX(${eOut(seg(t, t0, t0 + d))})`; };
const draw = (el, k) => { el.style.strokeDasharray = '100 100'; el.style.strokeDashoffset = (100 - 100 * clamp(k)).toFixed(2); el.style.opacity = k > .002 ? 1 : 0; };
function typeTo(el, str, t, t0, t1, caret = true) {
  const n = Math.round(str.length * seg(t, t0, t1));
  const blink = caret && (t < t0 || t > t1 + .25 ? Math.floor(t * 2.4) % 2 === 0 : true);
  el.innerHTML = esc(str.slice(0, n)) + (caret && t > t0 - .6 ? `<span class="caret" style="opacity:${blink ? 1 : 0}"></span>` : '');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const MW = s => s.split(' ').map(w => `<span class="mask"><span class="mi">${w}</span></span>`).join(' ');

// ---------- icons (stroke, 24 grid) ----------
const IC = {
  mega: '<path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  clip: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  plane: '<path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  euro: '<path d="M18 6.5A7 7 0 1 0 18 17.5"/><path d="M4 10h10M4 14h10"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  medal: '<circle cx="12" cy="15" r="6"/><path d="M8.2 10.4L5 2h4l3 6 3-6h4l-3.2 8.4"/>',
  ban: '<circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/>',
  helmet: '<path d="M2 18h20"/><path d="M4 18v-2a8 8 0 0 1 16 0v2"/><path d="M10 8.5V5h4v3.5"/>',
  hat: '<path d="M6.5 13.5C3.4 13.4 3 8.6 6.4 8 6.9 4.3 11.7 3.1 13.6 5.8 16.6 4.6 20.6 7.3 18.5 10.9 18 12 17.5 13.5 17.5 13.5"/><path d="M6.5 13.5h11v5.6h-11z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>',
};
const icon = (n, size = 24, col = '#fff', sw = 2.2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[n]}</svg>`;
const CIRC = (id, x, y, size, inner, bg = '#fff', extra = '') => `<div class="cc" id="${id}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${bg};${extra}">${inner}</div>`;
const OK = (id, x, y, size = 64) => `<div class="chk" id="${id}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px">${icon('check', size * .52, '#fff', 3.4)}</div>`;
const NO = (id, x, y, size = 64) => `<div class="chk no" id="${id}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px">${icon('x', size * .52, '#fff', 3.4)}</div>`;
const LOGO = 'data:image/png;base64,{{LOGO}}';
const EU = size => { let s = ''; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; s += `<path transform="translate(${50 + Math.sin(a) * 30},${50 - Math.cos(a) * 30}) scale(.32)" d="M0 -10 2.9 -4 9.5 -3.1 4.7 1.5 5.9 8.1 0 5 -5.9 8.1 -4.7 1.5 -9.5 -3.1 -2.9 -4z" fill="#ffcc00"/>`; } return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#003399"/>${s}</svg>`; };

// ---------- extra icons ----------
Object.assign(IC, {
  building: '<rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
  bed: '<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>',
  truck: '<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  factory: '<path d="M2 20V9l6 4V9l6 4V4h4l2 16z"/><path d="M2 20h20"/>',
  cross: '<path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/>',
  bank: '<path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  brief: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  lang: '<path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  video: '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
});
const FLAG = (c, w = 44) => c === 'it'
  ? `<svg width="${w}" height="${w * 2 / 3}" viewBox="0 0 3 2" style="border-radius:${w / 9}px;flex:none"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/><rect width="3" height="2" fill="none" stroke="#0002" stroke-width=".06"/></svg>`
  : `<svg width="${w}" height="${w * 2 / 3}" viewBox="0 0 3 2" style="border-radius:${w / 9}px;flex:none"><rect width="3" height=".67" fill="#111"/><rect y=".67" width="3" height=".67" fill="#dd0000"/><rect y="1.33" width="3" height=".67" fill="#ffce00"/></svg>`;
const WA = size => CIRC('', 0, 0, size, icon('chat', size * .5, '#fff', 2.4), '#25d366', 'position:relative;transform:none;flex:none');
