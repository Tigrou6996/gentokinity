<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>LBS Sito - Miniatura</title>
<style>
@font-face{font-family:PJS;src:url(data:font/woff2;base64,{{PJS}}) format('woff2');font-weight:200 800}
@font-face{font-family:INT;src:url(data:font/woff2;base64,{{INTER}}) format('woff2');font-weight:100 900}
:root{--p:#5e2d61;--l:#dab6fc;--d:#30103d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--p);font-family:INT}
#t>*{position:absolute}
.h1{font-family:PJS;font-weight:800;text-transform:uppercase;letter-spacing:-.025em;line-height:.92;color:#fff;white-space:nowrap}
.cc{border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(25,4,35,.4)}
</style></head><body>
<div id="t">
  <canvas id="bg" width="1280" height="720" style="left:0;top:0"></canvas>
  <div style="left:-300px;top:-300px;width:1100px;height:1000px;background:radial-gradient(closest-side,rgba(218,182,252,.22),rgba(218,182,252,0))"></div>
  <!-- diagonal bands, like the video's wipes -->
  <div style="left:900px;top:-200px;width:900px;height:1200px;background:#30103d;transform:skewX(14deg);transform-origin:0 0"></div>
  <div style="left:862px;top:-200px;width:22px;height:1200px;background:#dab6fc;transform:skewX(14deg);transform-origin:0 0"></div>
  <div style="left:830px;top:-200px;width:10px;height:1200px;background:#fff;opacity:.85;transform:skewX(14deg);transform-origin:0 0"></div>

  <!-- left: headline -->
  <div style="left:64px;top:58px;display:flex;align-items:center;gap:14px;padding:14px 28px 14px 16px;border-radius:999px;background:#dab6fc;color:#30103d;font:800 30px/1 INT;letter-spacing:.07em;box-shadow:0 10px 24px rgba(25,4,35,.35)">
    <img id="lg" style="width:46px;height:46px">AGENZIA PER IL LAVORO</div>
  <div class="h1" id="l1" style="left:60px;top:168px;font-size:106px">IL NOSTRO</div>
  <div class="h1" id="l2" style="left:58px;top:276px;font-size:116px;color:#dab6fc;text-shadow:0 9px 0 rgba(48,16,61,.55)">NUOVO SITO</div>
  <div style="left:64px;top:426px;display:flex;align-items:center;gap:14px;font:800 52px/1 PJS;letter-spacing:-.01em;color:#fff"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#dab6fc" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>lbswork.com</div>
  <div style="left:64px;top:528px;display:flex;gap:12px">
    <div style="padding:15px 24px;border-radius:999px;background:#fff;color:#5e2d61;font:800 23px/1 INT;letter-spacing:.03em;display:flex;align-items:center;gap:10px;box-shadow:0 12px 26px rgba(25,4,35,.35)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fbf6b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>OFFERTE DI LAVORO</div>
    <div style="padding:15px 24px;border-radius:999px;background:#fff;color:#5e2d61;font:800 23px/1 INT;letter-spacing:.03em;display:flex;align-items:center;gap:10px;box-shadow:0 12px 26px rgba(25,4,35,.35)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fbf6b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>CANDIDATURA ONLINE</div>
  </div>

  <!-- right: the site in a browser, showing a real job offer from the site -->
  <div style="left:830px;top:110px;width:410px;height:440px;border-radius:22px;background:#fff;overflow:hidden;transform:rotate(-4deg);box-shadow:0 30px 60px rgba(20,0,30,.55)">
    <div style="position:absolute;left:0;top:0;width:410px;height:48px;background:#30103d">
      <span style="position:absolute;left:18px;top:19px;width:11px;height:11px;border-radius:6px;background:#ff5f57"></span><span style="position:absolute;left:36px;top:19px;width:11px;height:11px;border-radius:6px;background:#febc2e"></span><span style="position:absolute;left:54px;top:19px;width:11px;height:11px;border-radius:6px;background:#28c840"></span>
      <span style="position:absolute;left:90px;top:10px;width:280px;height:28px;border-radius:14px;background:#4a2353;color:#eadff0;font:700 15px/28px INT;text-align:center">🔒 lbswork.com</span>
    </div>
    <img id="off" style="position:absolute;left:0;top:48px;width:410px;height:200px;object-fit:cover;object-position:50% 35%">
    <div style="position:absolute;left:22px;top:218px;padding:8px 14px;border-radius:999px;background:#dab6fc;color:#30103d;font:800 14px/1 INT;letter-spacing:.08em">LOGISTICA E MAGAZZINO</div>
    <div style="position:absolute;left:22px;top:270px;font:800 34px/1 PJS;color:#30103d;letter-spacing:-.02em">CORRIERE</div>
    <div style="position:absolute;left:22px;top:314px;display:flex;align-items:center;gap:8px;font:600 19px INT;color:#8a6a90"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9b6fa3" stroke-width="2.6" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Düsseldorf <svg width="24" height="16" viewBox="0 0 3 2" style="border-radius:4px;flex:none"><rect width="3" height=".67" fill="#111"/><rect y=".67" width="3" height=".67" fill="#dd0000"/><rect y="1.33" width="3" height=".67" fill="#ffce00"/></svg></div>
    <div style="position:absolute;left:22px;top:354px;font:800 30px/1 PJS;color:#5e2d61">€3.100 – €3.200</div>
    <div id="btn" style="position:absolute;left:22px;top:400px;width:366px;height:2px;background:#f0e8f4"></div>
  </div>
  <div style="left:930px;top:502px;white-space:nowrap;padding:16px 30px;border-radius:999px;background:#5e2d61;color:#fff;font:800 22px/1 INT;letter-spacing:.1em;box-shadow:0 12px 26px rgba(25,4,35,.45);transform:rotate(-4deg)">CANDIDATI ORA →</div>
  <svg style="left:1150px;top:528px;overflow:visible" width="44" height="54" viewBox="0 0 30 36"><path d="M2 2 L2 28 L8.5 22 L13 32.5 L17.5 30.5 L13 20.5 L22 20.5 Z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
  <img id="lg2" style="left:1110px;top:590px;width:110px;height:110px;border-radius:50%;box-shadow:0 16px 36px rgba(25,4,35,.5)">
  <div class="cc" style="left:1186px;top:60px;width:84px;height:84px;background:#2fbf6b;box-shadow:0 12px 26px rgba(20,90,50,.45)">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
  <div style="inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(20,0,30,.35) 100%)"></div>
</div>
<script>
const LOGO = 'data:image/png;base64,{{LOGO}}';
document.getElementById('lg').src = LOGO; document.getElementById('lg2').src = LOGO; document.getElementById('off').src = 'data:image/jpeg;base64,{{IMG_OFF}}';
const PAT = {
  truck: 'M2 6.5h11.5v9.5H2z M13.5 9.5h4.2l3.8 3.6v2.9h-8z M4 18.2a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0 M15.2 18.2a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0',
  pizza: 'M3.5 4.5Q12 1.5 20.5 4.5L12 21.5z M4.6 6.8Q12 4.2 19.4 6.8 M8.9 9.4a1.1 1.1 0 1 0 2.2 0a1.1 1.1 0 1 0 -2.2 0 M12.9 11.8a1.1 1.1 0 1 0 2.2 0a1.1 1.1 0 1 0 -2.2 0 M10.4 15.2a1 1 0 1 0 2 0a1 1 0 1 0 -2 0',
  hat: 'M6.5 13.5C3.4 13.4 3 8.6 6.4 8C6.9 4.3 11.7 3.1 13.6 5.8C16.6 4.6 20.6 7.3 18.5 10.9C18 12 17.5 13.5 17.5 13.5 M6.5 13.5h11v5.6h-11z M6.5 16.2h11',
  brief: 'M3 7.5h18v12H3z M9 7.5V5h6v2.5 M3 12.5h18',
};
const x = document.getElementById('bg').getContext('2d'), names = Object.keys(PAT);
x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = 1.25; x.lineJoin = x.lineCap = 'round';
for (let row = 0; row < 5; row++) for (let k = 0; k < 8; k++) {
  const cx = k * 175 + (row % 2 ? 88 : 0) + 30, cy = row * 150 + 50;
  x.save(); x.translate(cx, cy); x.rotate(((row * 7 + k * 3) % 5 - 2) * .08); x.scale(2.2, 2.2); x.translate(-12, -12); x.stroke(new Path2D(PAT[names[(row * 3 + k) % 4]])); x.restore();
}
</script></body></html>
