<style>

.mi{display:inline-block}
.wd{display:inline-block}

.hl>b{position:relative;font-weight:inherit}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.box{background:#fff;border:4px solid var(--d);box-shadow:12px 12px 0 var(--d)}
.cur{position:absolute;left:0;top:0;width:30px;height:36px;transform-origin:0 0;z-index:50}

 36.6    NUMERI (dal sito): 11+ anni, 350+ lavoratori, 200+ aziende, 100% supporto
 40.2    "Persone reali. Risultati concreti." foto ufficio in panoramica

 49.2    riser -> 51.0 WIPE -> CHIUSURA: LAVORO. ALLOGGIO. ASSISTENZA.              riser, impact

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const eIn = x => (x = clamp(x), x * x * x);
const expo = x => (x = clamp(x), x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
// camera keys: [t, cx, cy, scale, ease?]; scale is interpolated in log space so zooms feel even
const kcam = keys => t => {
  if (t <= keys[0][0]) return keys[0].slice(1, 4);
  for (let i = 1; i < keys.length; i++) {
    const A = keys[i - 1], B = keys[i];
    if (t <= B[0]) { const k = (B[4] || ease)((t - A[0]) / (B[0] - A[0])); return [lerp(A[1], B[1], k), lerp(A[2], B[2], k), Math.exp(lerp(Math.log(A[3]), Math.log(B[3]), k))]; }
  }
  return keys[keys.length - 1].slice(1, 4);
};
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

const tri = (t, a, b) => (t < a || t > b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const thou = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function tf(el, { x = 0, y = 0, s = 1, sx, sy, r = 0, o, b = 0, c = false } = {}) {
  let tr = (c ? 'translate(-50%,-50%) ' : '') + `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
  if (sx !== undefined || sy !== undefined) tr += ` scale(${sx ?? s},${sy ?? s})`; else if (s !== 1) tr += ` scale(${s})`;
  if (r) tr += ` rotate(${r}deg)`;
  el.style.transform = tr;
  if (o !== undefined) { el.style.opacity = o; el.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
  el.style.filter = b > 0.08 ? `blur(${b.toFixed(2)}px)` : 'none';
}
function cam(el, cx, cy, s, r = 0) { el.style.transform = `translate(${W / 2}px,${H / 2}px) scale(${s}) rotate(${r}deg) translate(${-cx}px,${-cy}px)`; }
const rise = (el, t, t0, d = .55, dy = 40, c = false) => { const k = eOut(seg(t, t0, t0 + d)); tf(el, { y: (1 - k) * dy, o: k, b: (1 - k) * 6, c }); };
const pop = (el, t, t0, d = .45, c = false) => { const k = spring(t - t0, 16, 1); tf(el, { s: lerp(.6, 1, k), o: clamp(k * 2.5), c }); };
const rev = (el, t, t0, d = .7) => { const k = expo(seg(t, t0, t0 + d)); el.style.transform = `translateY(${((1 - k) * 115).toFixed(2)}%)`; };
function sweep(el, t, t0, d = .35, c0, c1) { const k = eOut(seg(t, t0, t0 + d)); el.firstElementChild.style.transform = `scaleX(${k})`; if (c0) el.lastElementChild.style.color = k > .45 ? c1 : c0; }

function caretOn(t, t0, t1) { if (t < t0 || t > t1 + .7) return false; if (t <= t1) return true; return Math.floor((t - t1) * 3) % 2 === 0; }
function posIn(el, root) { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }

  for (let i = 0; i < 3; i++) { const t0 = 51.15 + i * .55, el = $('z_w' + i), mi = el.querySelector('.mi'); rev(mi, t, t0, .5); sweep(mi, t, t0 + .22, .3, '#fff', '#1a0d1e'); tf(el, { c: true }); }
  const bi = seg(t, 53.35, 53.7); $('c8b').style.opacity = bi; cam($('c8b'), 960, 540, lerp(1.12, 1.0, eOut(seg(t, 53.35, 56.2))));
  $('z_line').querySelectorAll('.wd').forEach((w, i) => rise(w, t, 53.45 + i * .11, .5, 40)); tf($('z_line'), { c: true });
  sweep($('z_hl'), t, 54.25, .35, '#fff', '#1a0d1e');
  const pp = ease(seg(t, 53.7, 55.0)), path = $('z_trail'), L = path.getTotalLength();
  const P = path.getPointAtLength(pp * L);
  $('z_svg').style.opacity = 1 - seg(t, 55.3, 55.9); $('z_svg').style.clipPath = `inset(0 ${(100 * (1 - clamp(P.x / W))).toFixed(2)}% 0 0)`;
  const P2 = path.getPointAtLength(Math.min(L, pp * L + 4)), ang = Math.atan2(P2.y - P.y, P2.x - P.x) * 180 / Math.PI;
  tf($('z_plane'), { x: P.x - 32, y: P.y - 32, r: ang + 45, o: pp > 0 && pp < 1 ? 1 : 0 });

U[9] = t => {
  cam($('c9'), 960, 540, lerp(1.0, 1.06, seg(t, 56, 62)));
  const lk = spring(t - 56.05, 15, 1); tf($('e_logo'), { s: lerp(.2, 1, lk), r: lerp(-25, 0, lk), o: clamp(lk * 3) });
  const p = seg(t, 56.1, 56.9), ring = $('e_ring'); ring.setAttribute('r', 140 + eOut(p) * 330); ring.setAttribute('stroke-width', 12 * (1 - p)); ring.style.opacity = p > 0 && p < 1 ? 1 - p : 0;
  const k = eOut(seg(t, 56.5, 57.5)); $('e_sub').style.letterSpacing = lerp(.8, .2, k) + 'em'; tf($('e_sub'), { c: true, o: k });
  const uk = spring(t - 57.0, 16, 1); tf($('e_url'), { c: true, s: lerp(.5, 1, uk), r: lerp(-6, 0, uk), o: clamp(uk * 3) });
  rise($('e_con'), t, 57.5, .6, 20, true);
};

function wipes(t) {
  const bars = [$('wb0'), $('wb1'), $('wb2')], off = [-.07, 0, .06];
  let T = null; for (const w of WIPES) if (Math.abs(t - w) < .62) T = w;
  bars.forEach((b, i) => {
    if (T === null) { b.style.visibility = 'hidden'; return; }
    const c = T + off[i];
    const x = t < c ? lerp(-4500, -1400, ease(seg(t, c - .42, c))) : lerp(-1400, 2300, ease(seg(t, c, c + .45)));
    b.style.visibility = (x > -4400 && x < 2250) ? 'visible' : 'hidden';
    b.style.transform = `translateX(${x}px) skewX(-18deg)`;
  });
}

function seekImpl(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const V = SC.map(s => vis(s, t));
  drawBg(t, V);
  SC.forEach((s, i) => {
    const v = V[i]; s.el.style.display = v > 0.001 ? 'block' : 'none';
    if (v <= 0.001) return;
    s.el.style.opacity = v;
    s.el.style.filter = v < .999 ? `blur(${((1 - v) * 10).toFixed(2)}px)` : 'none';
    U[i](t);
  });
  wipes(t);
  $('grain').style.backgroundImage = GRAIN[Math.floor(t * 24) % 4];
  $('fade').style.opacity = seg(t, 61.3, 62);
}

// ---------- sound ----------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PROG = [[62, 66, 69, 38], [61, 64, 69, 45], [62, 66, 71, 47], [62, 67, 71, 43]]; // D  A  Bm  G
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .2; comp.connect(ctx.destination);
  const bus = g => { const n = ctx.createGain(); n.gain.value = g; n.connect(comp); return n; };
  const music = bus(.45), sfx = bus(.55);
  const padBus = ctx.createGain(); padBus.connect(music);
  const nb = ctx.createBuffer(1, sr * 2, sr); { const d = nb.getChannelData(0), r = rng(1234); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const noise = (t, dur, { type = 'highpass', f = 1000, q = .7, g = .2, dest = sfx, f2, a = .002, pan = 0 } = {}) => {
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q; if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const e = ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + a); e.gain.exponentialRampToValueAtTime(.0005, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(fl); fl.connect(e); e.connect(p); p.connect(dest); s.start(t, (t * 7.3) % 1.5); s.stop(t + dur + .05);
  };
  const tone = (t, f, dur, { type = 'sine', g = .1, a = .005, dest = sfx, f2, lp, pan = 0, det = 0 } = {}) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = det; if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * .8);
    const e = ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + a); e.gain.exponentialRampToValueAtTime(.0005, t + dur);
    let n = o; if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; }
    const p = ctx.createStereoPanner(); p.pan.value = pan; n.connect(e); e.connect(p); p.connect(dest); o.start(t); o.stop(t + dur + .05);
  };
  // sections
  const drums = t => (t >= 4 && t < 10.6) || (t >= 13 && t < 50) || (t >= 51 && t < 56);
  const full = t => t >= 4 && t < 56;
  const claps = t => (t >= 13 && t < 49.5) || (t >= 51 && t < 56);
  // pad: one chord per bar, filter opens in the full sections
  for (let b = 0; b < 31; b++) {
    const t = b * 2, ch = PROG[b % 4], last = b === 30;
    const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.Q.value = .6;
    lpf.frequency.setValueAtTime(full(t + .1) ? 2200 : (t >= 56 ? 1500 : 900), t);
    const env = ctx.createGain(), len = last ? 2 : 2.15;
    env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(.065, t + .25); env.gain.setValueAtTime(.065, t + len - .3); env.gain.linearRampToValueAtTime(0, t + len);
    lpf.connect(env); env.connect(padBus);
    for (const m of ch.slice(0, 3)) for (const dt of [-8, 8]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = dt; o.connect(lpf); o.start(t); o.stop(t + len + .05); }
    // bass on the offbeat 8ths
    if (full(t + .1) && !(t >= 49.9 && t < 51) && !(t >= 10.6 && t < 13)) for (let k = 0; k < 4; k++) tone(t + k * .5 + .25, mtof(ch[3]), .22, { type: 'sawtooth', g: .16, lp: 420, dest: music });
    if (t >= 10.6 && t < 13) tone(t, mtof(ch[3]), 1.9, { type: 'sine', g: .14, a: .2, dest: music });
    // pluck arpeggio in 8ths
    if (t >= 2) { const pat = [0, 1, 2, 1, 3, 2, 1, 2]; for (let k = 0; k < 8; k++) { const tt = t + k * .25; if (tt >= 56.2 || (tt >= 50 && tt < 51)) continue; const m = (pat[k] === 3 ? ch[0] + 12 : ch[pat[k]]) + 12; tone(tt, mtof(m), .28, { type: 'triangle', g: t < 4 ? .035 : .05, lp: 3200, dest: music, pan: k % 2 ? .25 : -.25 }); } }
  }
  // drums and sidechain duck on the pad
  for (let i = 0; i < 124; i++) {
    const t = i * BEAT;
    if (drums(t)) {
      const o = ctx.createOscillator(), e = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      e.gain.setValueAtTime(.55, t); e.gain.exponentialRampToValueAtTime(.001, t + .38); o.connect(e); e.connect(music); o.start(t); o.stop(t + .4);
      padBus.gain.setValueAtTime(.35, t); padBus.gain.linearRampToValueAtTime(1, t + .28);
      noise(t + .25, .05, { f: 8000, g: .07, dest: music, pan: .2 });
      if (claps(t) && i % 2 === 1) for (const d of [0, .012, .024]) noise(t + d, .14, { type: 'bandpass', f: 1500, q: .9, g: .16, dest: music });
    }
  }
  // final chord ring-out + chime
  for (const m of [50, 57, 62, 66, 69]) tone(58, mtof(m), 4, { type: 'triangle', g: .03, a: .4, lp: 1800, dest: music });
  [74, 78, 81, 86].forEach((m, i) => { tone(56.25 + i * .09, mtof(m), 2.4, { g: .07 }); tone(56.25 + i * .09, mtof(m) * 2.01, 1.2, { g: .02 }); });
  // riser into the close + impacts

  tone(49.0, 110, 2.0, { type: 'sawtooth', f2: 880, g: .05, a: 1.8, lp: 2500 });
  for (const t of [2.2, 51.0, 56.05]) { tone(t, 120, .7, { f2: 34, g: .75 }); noise(t, .5, { type: 'lowpass', f: 900, g: .25 }); }
  // whooshes (wipes and big camera moves)
  for (const t of WIPES) noise(t - .4, .8, { type: 'bandpass', f: 400, f2: 4000, q: 1.2, g: .3, a: .35 });
  WHOOSH.forEach((t, i) => noise(t, .55, { type: 'bandpass', f: 2600, f2: 500, q: 1, g: .14, a: .2, pan: i % 2 ? .3 : -.3 }));
  // typing ticks, clicks, pops, check ticks
  for (const T of TYPING) for (let k = 0; k < T.s.length; k++) { const t = T.t + (k + .5) / T.cps; noise(t, .03, { f: 3200, g: .14, pan: (k % 3 - 1) * .15 }); tone(t, 1800 + (k % 4) * 90, .02, { g: .03 }); }
  for (const t of CLICKS) { noise(t, .025, { type: 'bandpass', f: 2600, q: 2, g: .3 }); tone(t, 900, .04, { g: .07 }); }
  for (let i = 0; i < 6; i++) { tone(ROWS_T(i) + .05, 1320 + i * 110, .12, { g: .07 }); tone(ROWS_T(i) + .05, 2640 + i * 220, .06, { g: .02 }); }
  for (let i = 0; i < 4; i++) tone(STEP_T(i) - .1, 520 + i * 60, .16, { f2: 820 + i * 60, g: .08 });
  for (let i = 0; i < 6; i++) tone(31.8 + i * .09, 700 + i * 50, .08, { f2: 1000, g: .045 });
  for (let i = 0; i < 4; i++) tone(37.0 + i * .22, 600, .12, { f2: 900, g: .05 });
  for (let i = 0; i < 3; i++) noise(51.37 + i * .55, .18, { type: 'bandpass', f: 1200, q: .8, g: .18 });
  tone(7.35, 300, .25, { f2: 110, g: .25 }); // sticker slap
  tone(49.35, 1046, .5, { g: .06 }); tone(49.43, 1568, .7, { g: .05 }); // sent
};

// ---------- boot ----------
async function boot() {
  await Promise.all([...document.fonts].map(f => f.load().catch(() => { })));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => { })));
  measure();
  window.seek = seekImpl;
  seekImpl(0);
  if (RENDER) return;
  const stage = $('stage'), fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; $('pb').textContent = 'Pausa ❚❚'; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; $('pb').textContent = 'Play ▶'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  $('pb').onclick = () => playing ? pause() : play();
  $('sc').oninput = e => { const was = playing; pause(); offset = e.target.value / 1000 * DUR; if (was) play(); };
  (function loop() { const t = now(); seekImpl(t); $('sc').value = t / DUR * 1000; $('tc').textContent = t.toFixed(2) + ' s'; requestAnimationFrame(loop); })();
}
boot();
