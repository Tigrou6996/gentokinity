<!doctype html>

<style>

<script>
/* ===== LBS — "Assistenza LBS" — 16:9 1920x1080, 72 s, voce ElevenLabs + musica 90 BPM (Mib maggiore) =====
 Tutti i tempi sotto sono in tempo-voce τ (il video parte 0.5 s prima della voce: t = τ + 0.5).
 τ       voce                                                   scena
 0.0     "Cos'è l'assistenza LBS?"                               domanda a parole mascherate, zoom-through
 2.7     "L'assistenza LBS è il nostro modo..."                  anello disegnato + logo + esplosione
 5.4     "...di dirti che non sei mai solo."                     panoramica giù: due persone + cuore
 7.8     "seguirti 24 ore su 24, sette giorni su sette"          24/24 con barra delle ore, whip-pan a 7/7
 13.0    "dal primo momento... nuova normalità"                  Italia -> aereo -> Germania -> lavoro -> casa
 19.2    "pianificare il viaggio, passo dopo passo"              percorso a serpentina, 4 tappe, pull-back
 26.75   WIPE  "Ma non ci fermiamo lì..."                        tipografia cinetica su viola scuro
 32.0    "dottori, banche, documenti, problemi"                  4 card, camera di card in card, spunte
 38.7    "E noi ci siamo, ogni volta che ci sei tu."             rete: persone -> LBS -> TU, impulsi
 42.1    "...non restare mai bloccato."                          lucchetto che si apre
 44.95   WIPE  "Se il posto... ti spostiamo nell'immediato"      sfondo bianco, card scartata -> nuovo posto
 50.7    "la tua serenità viene prima di tutto"                  cuore che batte
 54.6    "risposta a ogni singolo problema... con te e per te"   lista problemi risolti uno dopo l'altro
 61.45   WIPE  "Assistenza LBS. Non un servizio. Una presenza."  logo, poi frase finale con barrato
 67.1    END CARD: logo + "E tu cosa aspetti?" + contatti        dissolvenza a nero 70.5 -> 71.5 */
const W = 1920, H = 1080, O = 0.5;
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const eIn = x => (x = clamp(x), x * x * x);
const expo = x => (x = clamp(x), x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const lin = x => clamp(x);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kcam = keys => t => {
  if (t <= keys[0][0]) return keys[0].slice(1, 4);
  for (let i = 1; i < keys.length; i++) {
    const A = keys[i - 1], B = keys[i];
    if (t <= B[0]) { const k = (B[4] || ease)((t - A[0]) / (B[0] - A[0])); return [lerp(A[1], B[1], k), lerp(A[2], B[2], k), Math.exp(lerp(Math.log(A[3]), Math.log(B[3]), k))]; }
  }
  return keys[keys.length - 1].slice(1, 4);
};
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const tri = (t, a, b) => (t < a || t > b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));

function tf(el, { x = 0, y = 0, s = 1, sx, sy, r = 0, o, b = 0, c = false } = {}) {
  let tr = (c ? 'translate(-50%,-50%) ' : '') + `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
  if (sx !== undefined || sy !== undefined) tr += ` scale(${sx ?? s},${sy ?? s})`; else if (s !== 1) tr += ` scale(${s})`;
  if (r) tr += ` rotate(${r}deg)`;
  el.style.transform = tr;
  if (o !== undefined) { el.style.opacity = o; el.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
  el.style.filter = b > 0.08 ? `blur(${b.toFixed(2)}px)` : 'none';
}
function cam(el, cx, cy, s, r = 0) { el.style.transform = `translate(${W / 2}px,${H / 2}px) scale(${s}) rotate(${r}deg) translate(${-cx}px,${-cy}px)`; }
const camK = (id, f, t, r = 0) => { const [x, y, s] = f(t); cam($(id), x, y, s, r); };
const rise = (el, t, t0, d = .55, dy = 40, c = false) => { const k = eOut(seg(t, t0, t0 + d)); tf(el, { y: (1 - k) * dy, o: k, b: (1 - k) * 6, c }); };
// pop: spring scale-in for an element centred on its left/top
const pop = (el, t, t0, { c = true, from = .3, r0 = 0, w = 15, z = .62, x = 0, y = 0 } = {}) => { const k = spring(t - t0, w, z); tf(el, { x, y, s: Math.max(0, lerp(from, 1, k)), r: r0 * (1 - k), o: clamp((t - t0) * 7), c }); return k; };
// masked word reveal (in) and push-out (up) for every .mi inside el
function words(el, t, times, tOut = null, d = .55) {
  $$('.mi', el).forEach((w, i) => {
    const t0 = Array.isArray(times) ? times[Math.min(i, times.length - 1)] : times + i * .08;
    const ki = expo(seg(t, t0, t0 + d)), ko = tOut === null ? 0 : eIn(seg(t, tOut + i * .035, tOut + .32 + i * .035));
    w.style.transform = `translateY(${((1 - ki) * 135 - ko * 135).toFixed(2)}%)`;
  });
}
// slam: word drops in from big + blurred and settles with a spring
function slam(el, t, t0, from = 1.9) { const k = spring(t - t0, 17, .62), a = clamp((t - t0) * 9); tf(el, { s: lerp(from, 1, k), o: a, b: (1 - clamp((t - t0) / .14)) * 16 }); }
function slams(el, t, times) { $$('.sw', el).forEach((w, i) => slam(w, t, times[i])); }
function sweep(el, t, t0, d = .35, c0, c1) { const k = eOut(seg(t, t0, t0 + d)); el.firstElementChild.style.transform = `scaleX(${k})`; if (c0) el.lastElementChild.style.color = k > .45 ? c1 : c0; }
function ring(el, k) { el.style.strokeDasharray = `${(k * 100).toFixed(2)} 100`; el.style.opacity = k > .003 ? 1 : 0; }
function ripple(el, t, t0, r0, r1, d = .8, w0 = 6) { const p = seg(t, t0, t0 + d); el.setAttribute('r', lerp(r0, r1, eOut(p))); el.setAttribute('stroke-width', w0 * (1 - p) + .5); el.style.opacity = p > 0 && p < 1 ? (1 - p) : 0; }
function burst(g, t, t0, r0, r1, d = .55) {
  const p = seg(t, t0, t0 + d), on = p > 0 && p < 1, cx = +g.dataset.x, cy = +g.dataset.y, n = g.children.length;
  g.style.opacity = on ? 1 : 0; if (!on) return;
  [...g.children].forEach((l, i) => {
    const a = i / n * Math.PI * 2 + (+g.dataset.rot || 0), ri = lerp(r0, r1, eOut(p)), ro = ri + (r1 - r0) * .35 * (1 - p);
    l.setAttribute('x1', cx + Math.cos(a) * ri); l.setAttribute('y1', cy + Math.sin(a) * ri);
    l.setAttribute('x2', cx + Math.cos(a) * ro); l.setAttribute('y2', cy + Math.sin(a) * ro);
    l.setAttribute('stroke-width', 9 * (1 - p) + 1);
  });
}
const BURST = (id, x, y, n = 12, col = '#dab6fc', rot = 0) => `<g id="${id}" data-x="${x}" data-y="${y}" data-rot="${rot}" stroke="${col}" stroke-linecap="round" style="opacity:0">${'<line/>'.repeat(n)}</g>`;
// motion path helpers (SVG geometry, no layout needed)
function along(path, k) { const L = path.getTotalLength(), p = path.getPointAtLength(L * clamp(k)), q = path.getPointAtLength(Math.min(L, L * clamp(k) + 2)), p0 = path.getPointAtLength(Math.max(0, L * clamp(k) - 2)); return { x: p.x, y: p.y, a: Math.atan2(q.y - p0.y, q.x - p0.x) * 180 / Math.PI }; }

// ---------- icons ----------
const IC = { // stroke, 24 grid
  plane: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  brief: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 15l2.5 2.5L16 13"/>',
  key: '<circle cx="7.5" cy="15.5" r="5"/><path d="M11 12l10-10M16 7l3 3M19 4l2 2"/>',
  truck: '<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  bolt: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
};
const icon = (n, size = 24, col = '#fff', sw = 2.4, fill = 'none') => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const G = { // filled, 24 grid (same family as the reference video's white glyphs)
  person: '<circle cx="12" cy="7.3" r="4.4"/><path d="M3.4 21.6c0-5 3.8-8.4 8.6-8.4s8.6 3.4 8.6 8.4z"/>',
  heart: '<path d="M12 21.2s-7.6-4.6-9.7-9.3C.8 8.5 3 4.4 6.8 4.4c2.2 0 3.7 1.2 5.2 3.1 1.5-1.9 3-3.1 5.2-3.1 3.8 0 6 4.1 4.5 7.5-2.1 4.7-9.7 9.3-9.7 9.3z"/>',
  cross: '<path d="M9.2 2.5h5.6v6.7h6.7v5.6h-6.7v6.7H9.2v-6.7H2.5V9.2h6.7z"/>',
  bank: '<path d="M12 1.6 1.8 7v2.4h20.4V7z"/><rect x="3.7" y="10.8" width="3" height="7.2"/><rect x="10.5" y="10.8" width="3" height="7.2"/><rect x="17.3" y="10.8" width="3" height="7.2"/><rect x="1.8" y="19.2" width="20.4" height="3"/>',
  building: '<path fill-rule="evenodd" d="M5 2h14v20h-5v-4h-4v4H5z M8 5h2.4v2.4H8z M13.6 5H16v2.4h-2.4z M8 9.6h2.4V12H8z M13.6 9.6H16V12h-2.4z M8 14.2h2.4v2.4H8z M13.6 14.2H16v2.4h-2.4z"/>',
  home: '<path fill-rule="evenodd" d="M12 2.2 1.4 11.2h3.1v10.6h15V11.2h3.1z M10 21.8v-5.6h4v5.6z"/>',
  wa: '<path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.2 21.8l4.9-1.3A9.8 9.8 0 1 0 12 2.2z"/>',
};
const glyph = (n, size, col = '#5e2d61') => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${col}">${G[n]}</svg>`;
const CC = (id, x, y, size, inner, extra = '') => `<div class="cc" id="${id}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;${extra}">${inner}</div>`;
const FLAG = c => c === 'it'
  ? '<svg width="44" height="30" viewBox="0 0 3 2" style="border-radius:5px;flex:none"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/><rect width="3" height="2" fill="none" stroke="#0002" stroke-width=".06"/></svg>'
  : '<svg width="44" height="30" viewBox="0 0 3 2" style="border-radius:5px;flex:none"><rect width="3" height=".67" fill="#111"/><rect y=".67" width="3" height=".67" fill="#dd0000"/><rect y="1.33" width="3" height=".67" fill="#ffce00"/></svg>';
const MW = s => s.split(' ').map(w => `<span class="mask"><span class="mi">${w}</span></span>`).join(' ');
const SW = s => s.split(' ').map(w => `<span class="sw">${w}</span>`).join(' ');
const LOGO = 'data:image/png;base64,{{LOGO}}';
const CHECK = (id, x, y, size = 80) => CC(id, x, y, size, icon('check', size * .5, '#fff', 3.4), 'background:#2fbf6b;box-shadow:0 10px 24px rgba(20,90,50,.35)');

// ---------- shared timeline (τ = voice time; visuals and sound read the same numbers) ----------
const WIPES = [26.75, 44.95, 61.45];
const BIG = [2.72, 61.66];                                    // logo impacts
const POPS = [5.4, 6.0, 13.2, 15.85, 16.3, 17.6, 19.86, 21.3, 21.95, 23.7, 32.62, 34.06, 35.22, 36.88, 38.9, 39.0, 39.1, 40.1, 45.32, 49.0, 50.6, 67.25, 67.45];
const HEARTS = [6.86, 18.0, 52.04];
const DAYS_T = i => 11.3 + i * .17;                           // 7 day dots light up
const HOURS = [9.1, 10.55];                                   // 24 hour ticks
const CARD_T = [32.72, 34.16, 35.32, 36.98];
const CHECKS = [24.5, 37.62, 37.74, 37.86, 37.98, 44.02, 49.5];
const ROW_IN = i => 56.42 + i * .1, ROW_OK = [57.46, 58.02, 58.46, 58.95, 59.4];
const SLAMS = [26.88, 27.12, 27.34, 27.54, 28.06];
const WHOOSH = [2.25, 4.35, 7.55, 10.7, 12.25, 12.8, 18.8, 24.05, 28.35, 31.75, 37.45, 38.25, 41.8, 48.75, 50.4, 54.3, 63.4, 67.0];
// Reading holds (~1.5 s on screen once complete): at each break the picture freezes at τ = c for h seconds (with a slow push-in) while the voice
// pauses; the voice file is split at v, a silent point next to c. Holds just before a wipe are snapped so the
// wipe still lands on the music's beat grid.
const BPM = 90, BEAT = 60 / BPM, BAR = BEAT * 4, M0 = 0.1;              // music grid (timeline seconds minus O)
const BRK = [[2.04, 2.3, 1.3], [7.38, 7.5, 1.3], [10.7, 11.1, 1.3], [12.93, 12.85, 1.3], [18.62, 18.9, 1.3], [26.25, 26.8, 1.3],
  [28.38, 28.5, 1.3], [31.8, 31.8, 1.3], [38.3, 38.4, 1.3], [41.98, 41.95, 1.3], [44.45, 44.95, 1.3], [48.2, 48.4, 1.3],
  [50.2, 50.5, 1.3], [54.42, 54.42, 1.3], [60.9, 61.0, 1.3], [63.4, 63.5, 1.3], [66.5, 66.6, 1.3]].map(([c, v, h]) => ({ c, v, h }));
{ let D = 0; for (const b of BRK) { const w = WIPES.find(w => w > b.c && w - b.c < 1.5); if (w) { const r = (((w + D + b.h - M0) % BEAT) + BEAT) % BEAT; b.h += r > BEAT / 2 ? BEAT - r : -r; } D += b.h; } }
const HOLD = BRK.reduce((a, b) => a + b.h, 0), TAU_END = 72.5;
const DUR = O + TAU_END + HOLD;
window.VIDEO = { w: W, h: H, duration: DUR };
const m = tau => tau + BRK.reduce((a, b) => a + (b.c < tau ? b.h : 0), 0);              // voice time -> timeline (minus O)
const voT = tau => O + tau + BRK.reduce((a, b) => a + (b.v <= tau ? b.h : 0), 0);       // where the voice actually plays
function inv(x) { let held = 0; for (const b of BRK) { if (x < b.c) break; if (x < b.c + b.h) return { t: b.c, held: held + x - b.c }; x -= b.h; held += b.h; } return { t: x, held }; }
const heldBefore = tau => BRK.reduce((a, b) => a + (b.c < tau ? b.h : 0), 0);
let WT = 0;                                                                              // wall-clock timeline seconds
const SPEECH = [[0, 2.02], [2.68, 7.28], [7.8, 12.92], [13.04, 15.42], [15.58, 18.64], [19.16, 22.24], [22.54, 26.76], [26.88, 31.64], [32.02, 35.02], [35.32, 38.22], [38.68, 41.74], [42.14, 44.8], [45.1, 48.46], [48.58, 50.54], [50.68, 54.24], [54.64, 60.66], [61.64, 63.16], [63.88, 65.12], [65.56, 66.44]];

// ---------- scenes ----------
const P = '#5e2d61', D = '#30103d', WH = '#fbf8fd';
const SC = [
  { a: -0.5, b: 2.45, inT: 'cut', outT: 'cut', bg: P },
  { a: 2.35, b: 7.75, inT: 'fade', outT: 'fade', bg: P },
  { a: 7.6, b: 13.3, inT: 'fade', outT: 'fade', bg: P },
  { a: 12.95, b: 19.0, inT: 'fade', outT: 'fade', bg: P },
