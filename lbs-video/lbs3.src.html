// ---------- preview UI ----------
const isRender=location.search.includes('render');
if(isRender){document.body.classList.add('render');stage.style.transform='none';}
else{const fit=()=>{const s=Math.min(innerWidth/W,(innerHeight-60)/H);stage.style.transform=`scale(${s})`;};fit();addEventListener('resize',fit);}
let buf,ac,src,startAt=0,offset=0,playing=false;
const pbtn=document.getElementById('pb'),sl=document.getElementById('sc');
async function play(){ac??=new AudioContext();if(!buf){const off=new OfflineAudioContext(2,Math.ceil(48000*DUR),48000);await buildAudio(off);buf=await off.startRendering();
    try{const r=await fetch('audio/voice.mp3');const vb=await ac.decodeAudioData(await r.arrayBuffer());vbuf=vb;}catch(e){}}
  src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(0,offset%DUR);
  if(vbuf){vsrc=ac.createBufferSource();vsrc.buffer=vbuf;vsrc.connect(ac.destination);vsrc.start(0,offset%DUR);}
  startAt=ac.currentTime;playing=true;pbtn.textContent='Pause ❚❚';}
let vbuf,vsrc;
function pause(){if(!playing)return;offset+=ac.currentTime-startAt;src.stop();if(vsrc)vsrc.stop();playing=false;pbtn.textContent='Play ▶';}
pbtn.onclick=()=>playing?pause():play();
sl.oninput=()=>{const was=playing;pause();offset=sl.value/1000*DUR;if(was)play();};
function now(){return playing?(offset+ac.currentTime-startAt)%DUR:offset;}
if(!isRender)(function loop(){const t=now();seek(t);if(playing)sl.value=t/DUR*1000;document.getElementById('tc').textContent=t.toFixed(2)+'s';requestAnimationFrame(loop);})();
else seek(0);
