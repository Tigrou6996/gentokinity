#hud{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}

 69.9   copia e incolla il testo senza modifiche        77.15 regola d'oro: abbinamento annuncio -> gruppi
 95.3   CAPITOLO 3 · I contatti                         97.85 commento -> Messenger -> CV      105.6 scheda contatto
 114.95 rispondere solo con l'annuncio                  120   cittadinanza europea: sì / no
 130.05 CAPITOLO 4 · Cosa non fare                      133.05 costi/agenzia, insulti, scrivete a me
 152.05 CAPITOLO 5 · I compensi                         156   1 € per scheda, +20 € alla partenza
 167.8  riepilogo                                       181.1 saluti, logo */
const W = 1920, H = 1080, O = 0.5;

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const eIn = x => (x = clamp(x), x * x * x);
const expo = x => (x = clamp(x), x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const $ = id => document.getElementById(id);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function tf(el, { x = 0, y = 0, s = 1, r = 0, o, b = 0, c = false } = {}) {
  let tr = (c ? 'translate(-50%,-50%) ' : '') + `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
  if (s !== 1) tr += ` scale(${s.toFixed(4)})`;

  el.style.filter = b > 0.08 ? `blur(${b.toFixed(2)}px)` : 'none';
}
const rise = (el, t, t0, { d = .6, dy = 40, c = false, x = 0 } = {}) => { const k = eOut(seg(t, t0, t0 + d)); tf(el, { x, y: (1 - k) * dy, o: k, b: (1 - k) * 6, c }); return k; };
const pop = (el, t, t0, { c = false, from = .4, w = 13, z = .66, x = 0, y = 0, r0 = 0 } = {}) => { const k = spring(t - t0, w, z); tf(el, { x, y, s: Math.max(0, lerp(from, 1, k)), r: r0 * (1 - k), o: clamp((t - t0) * 6), c }); return k; };
const slideIn = (el, t, t0, { dx = 120, d = .7, c = false } = {}) => { const k = expo(seg(t, t0, t0 + d)); tf(el, { x: (1 - k) * dx, o: clamp((t - t0) / .25), b: (1 - k) * 8, c }); return k; };

  // messenger

  // pay

  popS(S(181.26)); chime(S(183.0), 84, .07); chime(S(183.12), 88, .06); chime(S(183.24), 91, .06);

async function boot() {

  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; $('pb').textContent = 'Pausa ❚❚'; }

  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;

  $('sc').oninput = e => { const was = playing; pause(); offset = e.target.value / 1000 * DUR; if (was) play(); };
