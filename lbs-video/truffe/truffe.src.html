<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBS Red Flag</title>
<style>
@font-face{font-family:PJS;src:url(data:font/woff2;base64,{{PJS}}) format('woff2');font-weight:200 800}
@font-face{font-family:INT;src:url(data:font/woff2;base64,{{INTER}}) format('woff2');font-weight:100 900}
:root{--p:#5e2d61;--l:#dab6fc;--d:#30103d;--r:#ff3b4f;--g:#2fbf6b;--y:#ffd43b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#1a0a22;transform-origin:0 0;font-family:INT}
#bg{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px}

.pill{position:absolute;display:flex;align-items:center;gap:22px;padding:26px 44px 26px 26px;border-radius:999px;background:#fff;color:#30103d;font:800 50px/1 PJS;box-shadow:0 18px 36px rgba(0,0,0,.35);white-space:nowrap}

<script>
/* ===== LBS — TikTok "3 red flag" — 9:16 1080x1920, voce + beat phonk 150 BPM (Mi minore) che passa in maggiore quando arriva LBS =====
 Area sicura TikTok: niente di importante sopra y 230, sotto y 1500, né a destra di x 930 (pulsanti).
 Sottotitoli parola per parola (testo del copione, tempi della voce). τ = tempo della voce, t = τ + O.
 0     hook: offerta "troppo bella", 3 bandierine, "Scappa!" allarme          5.78  RED FLAG #1 (drop del beat)
 8.0   chat: "Devi decidere entro stasera", countdown, ULTIMO POSTO, "Ah sì? Che fortuna", timbro TRUFFA, "ti lascia il tempo"
 17.2  RED FLAG #2   19.2 contratto e busta paga barrati, "ti paghiamo a mano", NO GRAZIE
 25.6 RED FLAG #3   25.9 caparra della casa, valigia, la casa sparisce (womp womp)
 34.24  LBS: logo, 11+ anni, IT->DE, contratto/alloggio/assistenza    44.8 ZERO ANTICIPI, TUTTO IN BUSTA PAGA
 49.95  condividi "Mandalo a chi sta per partire"     53.45  logo e contatti */
const W = 1080, H = 1920, O = 0.3;
const RENDER = location.search.includes('render'); if (RENDER) document.body.classList.add('render');
const TAU_END = 55.4, DUR = O + TAU_END;
window.VIDEO = { w: W, h: H, duration: DUR };
const $ = id => document.getElementById(id), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3)), eIn = x => (x = clamp(x), x * x * x);
const expo = x => (x = clamp(x), x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function spring(t, w = 14, z = .82) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
function tf(el, { x = 0, y = 0, s = 1, r = 0, o, b = 0, c = false } = {}) {
  el.style.transform = (c ? 'translate(-50%,-50%) ' : '') + `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
  if (o !== undefined) { el.style.opacity = o; el.style.visibility = o <= .002 ? 'hidden' : 'visible'; }
  el.style.filter = b > .08 ? `blur(${b.toFixed(2)}px)` : 'none';
}
const S = tau => O + tau;
const pop = (el, t, t0, { c = true, from = .3, w = 15, z = .55, x = 0, y = 0, r0 = 0, r = 0 } = {}) => { const k = spring(t - t0, w, z); tf(el, { x, y, s: Math.max(0, lerp(from, 1, k)), r: r + r0 * (1 - k), o: clamp((t - t0) * 8), c }); return k; };
const slam = (el, t, t0, { from = 2.2, r = 0, c = true } = {}) => { const k = spring(t - t0, 18, .6); tf(el, { s: lerp(from, 1, k), r, o: clamp((t - t0) * 10), b: (1 - clamp((t - t0) / .12)) * 14, c }); };
const fly = (el, t, t0, { dx = 0, dy = 300, d = .5, c = true } = {}) => { const k = expo(seg(t, t0, t0 + d)); tf(el, { x: (1 - k) * dx, y: (1 - k) * dy, o: clamp((t - t0) * 6), b: (1 - k) * 10, c }); return k; };

// ---------- icons ----------
const IC = {
  check: '<path d="M20 6L9 17l-5-5"/>', x: '<path d="M18 6L6 18M6 6l12 12"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  share: '<path d="M14 4l7 7-7 7v-4c-6 0-9 2-11 6 1-7 4-11 11-12z"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a17.2 17.2 0 0 1 4 10 17.2 17.2 0 0 1-4 10 17.2 17.2 0 0 1-4-10 17.2 17.2 0 0 1 4-10z"/>',
  plane: '<path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>',
  chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  euro: '<path d="M18 6.5A7 7 0 1 0 18 17.5"/><path d="M4 10h10M4 14h10"/>',
  star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
};
const icon = (n, s = 24, col = '#fff', sw = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[n]}</svg>`;
const FLAG = (c, w = 44) => c === 'it'
  ? `<svg width="${w}" height="${w * 2 / 3}" viewBox="0 0 3 2" style="border-radius:${w / 9}px;flex:none"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>`
  : `<svg width="${w}" height="${w * 2 / 3}" viewBox="0 0 3 2" style="border-radius:${w / 9}px;flex:none"><rect width="3" height=".67" fill="#111"/><rect y=".67" width="3" height=".67" fill="#dd0000"/><rect y="1.33" width="3" height=".67" fill="#ffce00"/></svg>`;
const LOGO = 'data:image/png;base64,{{LOGO}}';
// waving red flag (path rebuilt every frame)
const RFLAG = (id, size) => `<svg id="${id}" width="${size}" height="${size}" viewBox="0 0 100 100"><rect x="14" y="6" width="7" height="92" rx="3.5" fill="#e9dff0"/><path class="wave" fill="#ff3b4f"/></svg>`;
function wave(svg, t, amp = 1) { const p = svg.querySelector('.wave'); let d = 'M21 10'; for (let i = 0; i <= 10; i++) { const x = 21 + i * 7, y = 10 + Math.sin(t * 9 - i * .7) * 4 * amp * (i / 10); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; } for (let i = 10; i >= 0; i--) { const x = 21 + i * 7, y = 52 + Math.sin(t * 9 - i * .7 - .5) * 4 * amp * (i / 10); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; } p.setAttribute('d', d + 'Z'); }
const NOTE = (id, v = '€') => `<div class="a ctr" id="${id}" style="width:200px;height:104px;border-radius:12px;background:#3fbf7a;border:6px solid #2a9a5d;display:flex;align-items:center;justify-content:center;font:800 54px PJS;color:#e9fff1;box-shadow:0 10px 20px rgba(0,0,0,.3)">${v}</div>`;
const SUIT = (s, col = '#fff') => `<svg width="${s}" height="${s * .95}" viewBox="0 0 400 380"><g fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M150 92 V52 Q150 30 172 30 H228 Q250 30 250 52 V92"/><rect x="40" y="92" width="320" height="240" rx="30"/><path d="M120 92 V332 M280 92 V332"/><circle cx="95" cy="352" r="17"/><circle cx="305" cy="352" r="17"/></g></svg>`;

// ---------- captions (script words on voice timings) ----------
const CAPS = {{CAPS}};
// ---------- timeline ----------
const RF = [[5.78, 1], [17.2, 2], [25.6, 3]];
const HITS = [[4.7, 30, '#ff3b4f', .55], [5.78, 40, '#ff3b4f', .7], [10.32, 12, '#ffd43b', .15], [12.46, 30, '#ff3b4f', .45], [14.32, 12, '#2fbf6b', .25], [17.2, 40, '#ff3b4f', .7], [20.02, 14, '#ff3b4f', .2], [21.54, 14, '#ff3b4f', .2],
  [24.4, 26, '#ff3b4f', .4], [25.6, 40, '#ff3b4f', .7], [32.86, 16, '#000', .0], [34.24, 26, '#dab6fc', .7], [34.88, 22, '#fff', .3], [47.08, 26, '#2fbf6b', .45], [49.34, 18, '#2fbf6b', .3]];
const SC = [['hook', 0, 5.7, 'dark'], ['rf1', 5.7, 8.0, 'red'], ['chat1', 8.0, 17.15, 'dark'], ['rf2', 17.15, 19.2, 'red'], ['docs', 19.2, 25.55, 'dark'], ['rf3', 25.55, 26.95, 'red'],
  ['house', 26.95, 34.15, 'dark'], ['lbs1', 34.15, 38.1, 'lbs'], ['lbs2', 38.1, 41.8, 'lbs'], ['lbs3', 41.8, 46.3, 'lbs'], ['fin', 46.3, 49.95, 'lbs'], ['cta', 49.95, 53.45, 'lbs'], ['end', 53.45, TAU_END + 1, 'lbs']].map(([id, a, b, bg]) => ({ id, a, b, bg }));
const HTML = {}, U = {};

// hook: the "too good" offer ----------------------------------------------------------
HTML.hook = `
  <div class="card" id="hk_c" style="left:150px;top:400px;width:780px;height:700px;overflow:hidden">
    <div style="height:150px;background:linear-gradient(90deg,#ffb703,#ffd43b);display:flex;align-items:center;gap:22px;padding:0 44px;font:800 54px PJS;color:#1c1022">${icon('star', 60, '#1c1022', 2.4)}OFFERTA TOP!!!</div>
    <div style="padding:40px 44px;font:800 50px/1.35 PJS">${FLAG('de', 70)}&nbsp; Lavoro in Germania<div style="font:700 42px/1.6 INT;color:#5a4a63;margin-top:18px">💸 Guadagni altissimi!!!<br>Parti subito!!!<br>Nessun contratto, tranquillo</div></div>
    <div style="position:absolute;left:44px;right:44px;bottom:44px;height:110px;border-radius:24px;background:#1c1022;display:flex;align-items:center;justify-content:center;font:800 46px INT;color:#fff">SCRIVICI ORA</div>
  </div>
  ${[0, 1, 2].map(i => `<div class="a ctr" id="hk_f${i}">${RFLAG('hk_fl' + i, 170)}</div>`).join('')}
  <div class="a" id="hk_al" style="left:150px;top:400px;width:780px;height:700px;border-radius:36px;border:14px solid #ff3b4f;box-shadow:0 0 60px #ff3b4f"></div>`;
U.hook = t => {
  const k = spring(t - S(.15), 11, .62); tf($('hk_c'), { y: (1 - k) * 600, r: (1 - k) * 8, o: clamp((t - S(.15)) * 5) });
  [[2.94, 230, 380, -14], [3.2, 540, 330, 4], [3.44, 850, 380, 16]].forEach(([a, x, y, r], i) => { pop($('hk_f' + i), t, S(a), { from: .1, x, y, r }); wave($('hk_fl' + i), t); });
  const al = t > S(4.7) ? .5 + .5 * Math.sin((t - S(4.7)) * 26) : 0; $('hk_al').style.opacity = al;
  if (t > S(4.7)) { const s = seg(t, S(5.25), S(5.7)); $('hk_c').style.transform += ` translate(${Math.sin(t * 90) * 10 + eIn(s) * 1200}px,0) rotate(${eIn(s) * 25}deg)`; $('hk_al').style.transform = $('hk_c').style.transform.replace(/^.*?translate/, 'translate'); }
};
// red flag title cards ----------------------------------------------------------------
RF.forEach(([a, n]) => {
  const id = 'rf' + n;
  HTML[id] = `<div class="a ctr" id="${id}_g" style="left:500px;top:700px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(255,59,79,.45),rgba(255,59,79,0) 65%)"></div>
  <div class="a ctr" id="${id}_f">${RFLAG(id + '_fl', 520)}</div>
  <div class="a ctr h1" id="${id}_t" style="left:500px;top:1040px;font-size:150px">RED FLAG</div>
  <div class="a ctr h1" id="${id}_n" style="left:500px;top:1040px;font-size:150px;color:#ff3b4f;opacity:0">#${n}</div>`;
  U[id] = t => {
    const t0 = S(a);
    pop($(id + '_f'), t, t0, { from: .2, x: 540, y: 660, r0: -40, c: true }); wave($(id + '_fl'), t, 1.4);
    $(id + '_g').style.transform = `translate(-50%,-50%) scale(${.8 + .2 * Math.sin(t * 6)})`;
    slam($(id + '_t'), t, t0 + .12, { from: 2 });
    const kn = spring(t - S(a + .98), 16, .5); tf($(id + '_n'), { c: true, x: 0, y: 170, s: t > S(a + .98) ? lerp(3, 1, kn) : 0, o: t > S(a + .98) ? 1 : 0, r: -6 });
  };
});
// chat 1: "decide tonight, only one place left" ------------------------------------------
const PHONE = (id, name) => `<div class="card" id="${id}" style="left:120px;top:330px;width:840px;height:760px;background:#efe7f3;overflow:hidden">
  <div style="height:150px;background:#2b1236;display:flex;align-items:center;gap:24px;padding:0 36px">
    <div style="width:90px;height:90px;border-radius:50%;background:#7a6a82;display:flex;align-items:center;justify-content:center;font:800 54px PJS;color:#fff">?</div>
    <div><div style="font:800 40px PJS;color:#fff">${name}</div><div style="font:600 28px INT;color:#7ee2a2">online</div></div></div></div>`;
HTML.chat1 = `${PHONE('c1_p', 'Lavoro Germania VIP')}
  <div class="bub" id="c1_ty" style="left:170px;top:530px;width:200px;font-size:60px;letter-spacing:.1em">•••</div>
  <div class="bub" id="c1_b" style="left:170px;top:530px;width:720px">Devi decidere <b style="color:#d9233a">entro stasera</b>!!! È rimasto UN SOLO posto ⏰</div>
  <div class="a ctr" id="c1_tm" style="padding:18px 40px;border-radius:24px;background:#ff3b4f;color:#fff;font:800 96px/1 PJS;letter-spacing:.02em;box-shadow:0 14px 30px rgba(0,0,0,.35);font-variant-numeric:tabular-nums">00:59:59</div>
  <div class="sticker" id="c1_u" style="left:0;top:0;background:#ffd43b">ULTIMO POSTO!!!</div>
  <div class="sticker" id="c1_s" style="left:0;top:0;background:#fff">Ah sì? Che fortuna 🙄</div>
  <div class="stamp" id="c1_st" style="left:0;top:0">TRUFFA</div>
  <div class="card" id="c1_ok" style="left:140px;top:760px;width:800px;height:240px;display:flex;align-items:center;gap:30px;padding:0 40px">
    <div style="width:130px;height:130px;border-radius:50%;background:#2fbf6b;display:flex;align-items:center;justify-content:center;flex:none">${icon('clock', 76, '#fff', 2.2)}</div>
    <div style="font:800 54px/1.1 PJS">Chi è serio<br><span style="color:#2fbf6b">ti lascia il tempo</span></div></div>`;
U.chat1 = t => {
  fly($('c1_p'), t, S(8.0), { dy: 500, c: false });
  const ty = t > S(7.8) && t < S(8.1); $('c1_ty').style.opacity = ty ? 1 : 0; $('c1_ty').style.transform = `scale(${1 + .06 * Math.sin(t * 20)})`;
  pop($('c1_b'), t, S(8.1), { c: false, from: .5 }); $('c1_b').style.transformOrigin = '0 100%';
  const left = Math.max(0, 3599 - Math.floor((t - S(8.96)) * 97)), mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
  $('c1_tm').textContent = `00:${mm}:${ss}`; pop($('c1_tm'), t, S(8.96), { from: .3, x: 540, y: 860 }); if (t > S(8.96)) $('c1_tm').style.transform += ` scale(${1 + .04 * Math.sin((t - S(8.96)) * 14)})`;
  pop($('c1_u'), t, S(10.32), { from: .2, x: 720, y: 470, r: 10, r0: -30 }); if (t > S(10.32)) $('c1_u').style.transform += ` scale(${1 + .05 * Math.sin((t - S(10.32)) * 18)})`;
  pop($('c1_s'), t, S(11.38), { from: .2, x: 470, y: 990, r: -6, r0: 30 });
  const sk = spring(t - S(12.46), 16, .5); tf($('c1_st'), { c: true, x: 520, y: 640, s: t > S(12.46) ? lerp(2.4, 1, sk) : 0, r: -12, o: t > S(12.46) ? 1 : 0 });
  const dim = seg(t, S(13.4), S(13.7)); if (dim > 0) ['c1_p', 'c1_b', 'c1_tm', 'c1_u', 'c1_s', 'c1_st'].forEach(id => { $(id).style.opacity = Math.min(+$(id).style.opacity || 1, 1 - (id === 'c1_s' ? 1 : .75) * dim); });
  pop($('c1_ok'), t, S(14.32), { c: false, from: .5 });
