body.render.demo .demo { display: flex; }
svg { position: absolute; left: 0; top: 0; overflow: visible; }
text { font-family: 'Bangers', sans-serif; }
.o { stroke: #2A1830; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #000c; color: #ddd; font-size: 13px; }
#ui input[type=range] { flex: 1; }
#ui button { background: #F07A3A; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
body.render #ui { display: none; }

  const mx = 960, Mx = mx, My = my;                   // mouth centre in world space
  const fx = lerp(Mx, 960, k) + shx, fy = lerp(My, 540, k) + shy;
  $('cam').setAttribute('transform', `translate(${f1(fx)} ${f1(fy)}) scale(${s.toFixed(4)}) translate(${f1(-Mx)} ${f1(-My)})`);
  // boil only while the characters are near normal size
  const boilOn = s < 1.6;
  $('world').setAttribute('filter', boilOn ? 'url(#boil)' : '');
  $('boilNoise').setAttribute('seed', 1 + Math.floor(t * 12));

  // ---- monster
  const vy = (monY(t) - monY(t - 1 / 120)) * 120;
  const st = clamp(-vy / 7000, -.18, .3);
  const sy = MONSTER_SCALE * (1 + st), sxm = MONSTER_SCALE / Math.sqrt(1 + st);
  const breathe = Math.sin(t * 20) * .012 * seg(t, .4, .5);
  $('monster').setAttribute('transform', `translate(${mx} ${f1(my)}) rotate(${monRot(t).toFixed(2)}) scale(${(sxm * (1 + breathe)).toFixed(4)} ${(sy * (1 - breathe)).toFixed(4)})`);
  const o = open(t), rx = 120 + 95 * o, ry = 10 + 158 * o;
  const mp = mouthPath(rx, ry);
  for (const id of ['mouthClipPath', 'mouthBack', 'mouthLipO', 'mouthLip']) $(id).setAttribute('d', mp);
  const chin = Math.max(205, ry * 1.1 + 70);
  $('mHead').setAttribute('d', `M0,-420 C175,-420 236,-290 232,-140 C230,0 226,${chin - 70} 0,${chin} C-226,${chin - 70} -230,0 -232,-140 C-236,-290 -175,-420 0,-420 Z`);
  // parallax planes inside the mouth: deeper = scales less than the camera
  const sDeep = 1 + (s - 1) * .32, sMid = 1 + (s - 1) * .62;
  $('mDeep').setAttribute('transform', `scale(${(sDeep / s).toFixed(4)})`);
  $('mMid').setAttribute('transform', `scale(${(sMid / s).toFixed(4)}) translate(0 ${f1(ry * .55 - 95)})`);
  $('uvula').setAttribute('transform', `rotate(${(Math.sin(t * 14) * 9).toFixed(2)} 0 -130)`);
  $('tongue').setAttribute('transform', `rotate(${(Math.sin(t * 11) * 4 * seg(t, .4, .5)).toFixed(2)} 0 150)`);
  for (const T of TEETH) { if (!T.node) continue;
    const y = T.top ? topEdge(T.x * rx / 215, rx, ry) : botEdge(T.x * rx / 215, rx, ry);
    T.node.setAttribute('transform', `translate(${f1(T.x * rx / 215)} ${f1(y)}) rotate(${T.rot.toFixed(1)}) scale(${(.4 + .6 * o).toFixed(3)})`); }
  // eyes, lids, brow
  const lk = look(t);
  $('mIrisL').setAttribute('transform', `translate(${f1(lk * 20)} ${f1(-Math.abs(lk) * 4 + (1 - Math.abs(lk)) * 6)})`);
  $('mIrisR').setAttribute('transform', `translate(${f1(lk * 18)} ${f1(-Math.abs(lk) * 4 + (1 - Math.abs(lk)) * 6)})`);
  const l = lid(t);
  $('mLidL').setAttribute('height', f1(132 * l + 6)); $('mLidR').setAttribute('height', f1(116 * l + 6));
  const lyL = -334 + 132 * l + 6, lyR = -320 + 116 * l + 6;
  const chord = (cx, cy, r, y) => { const h = Math.sqrt(Math.max(0, r * r - (y - cy) ** 2)); return `M${f1(cx - h)},${f1(y)} L${f1(cx + h)},${f1(y)}`; };
  $('mLidLineL').setAttribute('d', chord(-90, -268, 66, lyL)); $('mLidLineR').setAttribute('d', chord(94, -262, 58, lyR));
  const ang = lerp(0, 1, seg(t, .38, .5));
  const bl = -350 - 30 * (1 - l) + ang * 10;
  $('mBrow').setAttribute('d', `M-170,${f1(bl + 10)} C-120,${f1(bl - 40 + ang * 30)} -40,${f1(bl - 30 + ang * 40)} 0,${f1(bl + ang * 26)} C40,${f1(bl - 30 + ang * 40)} 120,${f1(bl - 40 + ang * 30)} 170,${f1(bl + 6)} C140,${f1(bl + 30)} 110,${f1(bl + 14)} 90,${f1(bl + 28)} C70,${f1(bl + 14)} 40,${f1(bl + 30 + ang * 20)} 0,${f1(bl + 34 + ang * 24)} C-40,${f1(bl + 30 + ang * 20)} -70,${f1(bl + 14)} -90,${f1(bl + 30)} C-110,${f1(bl + 14)} -140,${f1(bl + 30)} -170,${f1(bl + 10)} Z`);
  // arms: raised claws, waving
  const raise = spring(t - .3, 12, .5);
  for (const [dir, ido, idf, hand] of [[-1, 'mArmLo', 'mArmLf', 'mHandL'], [1, 'mArmRo', 'mArmRf', 'mHandR']]) {
    const wv = Math.sin(t * 16 + dir) * 18 * raise;
    const sh = [dir * 170, 250], el2 = [dir * lerp(260, 330, raise), lerp(380, 170, raise) + wv * .5], hd = [dir * lerp(280, 360, raise) + wv, lerp(500, -20, raise)];
    const d = `M${sh[0]},${sh[1]} Q${f1(el2[0])},${f1(el2[1])} ${f1(hd[0])},${f1(hd[1])}`;
    $(ido).setAttribute('d', d); $(idf).setAttribute('d', d);
    $(hand).setAttribute('transform', `translate(${f1(hd[0])} ${f1(hd[1])}) rotate(${f1(dir * lerp(40, 10, raise) + wv * .5)}) scale(1.1)`);
  }

  // ---- kid and banana guy (run in, panic)
  const panic = seg(t, .44, .5);
  const pose = (pre, x, v, jumpT, flip) => {
    const runAmt = clamp(Math.abs(v) / 900);
    const ph = t * 22;
    const jump = Math.sin(Math.PI * seg(t, jumpT, jumpT + .26)) * 80;
    const shiver = panic * Math.sin(t * 70) * 3;
    $(pre).setAttribute('transform', `translate(${f1(x + shiver)} ${f1(1068 - jump)}) scale(${flip} 1) rotate(${f1(runAmt * 8)})`);
    return { runAmt, ph };
  };
  const kv = (kidX(t) - kidX(t - 1 / 120)) * 120, bv = (banX(t) - banX(t - 1 / 120)) * 120;
  const kp = pose('kid', kidX(t), kv, .46, 1), bp = pose('ban', banX(t), bv, .48, -1);
  // limbs are shared by the <use> copies inside the mouth, so they animate from time only
  const swing = (amt, ph, off) => Math.sin(ph + off) * 34 * amt;
  const flail = Math.max(panic, t > .9 ? 1 : 0);
  $('kLegL').setAttribute('transform', `rotate(${f1(swing(kp.runAmt + flail * .6, kp.ph, 0))} -26 -150)`);
  $('kLegR').setAttribute('transform', `rotate(${f1(swing(kp.runAmt + flail * .6, kp.ph, Math.PI))} 26 -150)`);
  $('kArmL').setAttribute('transform', `rotate(${f1(lerp(-60, 0, Math.max(panic, flail)) + Math.sin(t * 40) * 14 * flail)} -56 -318)`);
  $('kArmR').setAttribute('transform', `rotate(${f1(lerp(70, 0, Math.max(panic, flail)) + Math.sin(t * 40 + 1) * 14 * flail)} 56 -318)`);
  $('bLegL').setAttribute('transform', `rotate(${f1(swing(bp.runAmt + flail * .6, bp.ph + 1, 0))} -30 -130)`);
  $('bLegR').setAttribute('transform', `rotate(${f1(swing(bp.runAmt + flail * .6, bp.ph + 1, Math.PI))} 30 -130)`);
  $('bArmL').setAttribute('transform', `rotate(${f1(lerp(-70, 0, Math.max(panic, flail)) + Math.sin(t * 38) * 14 * flail)} -96 -330)`);
  $('bArmR').setAttribute('transform', `rotate(${f1(lerp(70, 0, Math.max(panic, flail)) + Math.sin(t * 38 + 2) * 14 * flail)} 96 -330)`);
  const scream = .35 + .65 * panic;
  $('kMouth').setAttribute('transform', `translate(23 -384) scale(1 ${scream.toFixed(3)}) translate(-23 384)`);
  $('bMouth').setAttribute('transform', `translate(16 -384) scale(1 ${scream.toFixed(3)}) translate(-16 384)`);
  const pup = lerp(4, -2, panic);
  for (const id of ['kPupL', 'kPupR', 'bPupL', 'bPupR']) $(id).setAttribute('transform', `translate(${f1(pup)} ${f1(-3 * panic)}) scale(${(1 - .45 * panic).toFixed(3)})`);
  // "!" pops
  [[kidX(t) + 10, .46], [banX(t) - 10, .5]].forEach(([x, tb], i) => {
    const p = spring(t - tb, 18, .45), out = seg(t, .62, .7);
    BANGS[i].setAttribute('transform', `translate(${f1(x)} ${f1(1068 - 600 - (i ? 90 : 0) - Math.sin(Math.PI * seg(t, tb, tb + .26)) * 80)}) scale(${(p * (1 - out)).toFixed(3)}) rotate(${i ? 12 : -12})`);
  });

  // ---- swallowed: the kids tumble into the throat (screen space)
  const fall = (id, t0, a0, sc0, spin) => {
    const p = seg(t, t0, 1.30), on = t > t0 && p < 1;
    const e = easeIn(1.6)(p), R = lerp(1150, 0, e), a = a0 + p * 2.4;
    const x = 960 + Math.cos(a) * R, y = 540 + Math.sin(a) * R * .62;
    const sc = lerp(sc0, .02, easeIn(1.3)(p));
    $(id).setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(spin * p * 540)}) scale(${sc.toFixed(4)}) translate(0 280)`);
    $(id).style.display = on ? '' : 'none';
    return { x, y, sc, on };
  };
  const fk = fall('fallKid', .93, Math.PI * .95, 1.05, 1), fb = fall('fallBan', .96, -.1, 1.0, -1);
  for (const [id, f] of [['aah1', fk], ['aah2', fb]]) {
    $(id).style.display = f.on && f.sc > .12 ? '' : 'none';
    $(id).setAttribute('transform', `translate(${f1(f.x)} ${f1(f.y - 330 * f.sc)}) scale(${(f.sc * 1.2).toFixed(3)}) rotate(${f1(Math.sin(t * 30) * 6)})`);
  }

  // ---- throat iris reveals the next scene
  const R = irisR(t);
  if (R > 0) {
    let d = ''; const n = 64;
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2, rr = R * (1 + .05 * Math.sin(5 * a + t * 9) + .035 * Math.sin(3 * a - t * 7));
      d += (i ? 'L' : 'M') + f1(960 + Math.cos(a) * rr) + ',' + f1(540 + Math.sin(a) * rr * .9);
    }
    $('irisHole').setAttribute('d', d + 'Z'); $('irisRimO').setAttribute('d', d + 'Z'); $('irisRim').setAttribute('d', d + 'Z');
    $('masked').setAttribute('mask', 'url(#iris)');
  } else { for (const id of ['irisHole', 'irisRimO', 'irisRim']) $(id).setAttribute('d', ''); $('masked').removeAttribute('mask'); }
  $('masked').style.display = R > 1500 ? 'none' : '';

  // ---- speed lines during the dive
  const sp = seg(t, .55, .7) * (1 - seg(t, .86, .95));
  $('speed').style.display = sp > 0 ? '' : 'none';
  for (const L of LINES) {
    const r0 = L.r0 * lerp(1.3, .9, seg(t, .55, .93)), r1 = 1500, a = L.a + t * .4;
    const p = (ang, r) => f1(960 + Math.cos(ang) * r) + ',' + f1(540 + Math.sin(ang) * r);
    L.node.setAttribute('d', `M${p(a, r0)} L${p(a - L.w, r1)} L${p(a + L.w, r1)} Z`);
    L.node.setAttribute('opacity', (sp * .55).toFixed(3));
  }

  // ---- saliva drops fly out of the throat at the camera
  for (const D of DROPS) {
    const p = seg(t, 1.32 + D.d, 1.85 + D.d), on = p > 0 && p < 1;
    D.node.style.display = on ? '' : 'none';
    if (!on) continue;
    const r = lerp(120, 1500, easeIn(1.7)(p) * D.sp), sz = D.sz * lerp(.6, 4.5, easeIn(2)(p));
    D.node.setAttribute('transform', `translate(${f1(960 + Math.cos(D.a) * r)} ${f1(540 + Math.sin(D.a) * r * .8)}) rotate(${f1(D.a * 180 / Math.PI - 90)}) scale(${sz.toFixed(2)})`);
  }

  // ---- GULP!
  const gp = spring(t - .91, 20, .42), gOut = easeIn(1.6)(seg(t, 1.28, 1.44));
  $('gulp').style.display = t > .91 && gOut < 1 ? '' : 'none';
  $('gulp').setAttribute('transform', `translate(960 ${f1(470 - gOut * 60)}) rotate(${f1(-8 + Math.sin(t * 25) * 2)}) scale(${(gp * (1 + gOut * 2.4)).toFixed(3)})`);
  $('gulp').setAttribute('opacity', (1 - seg(gOut, .5, 1)).toFixed(3));
}
window.seek = seek;

// ---------- sound: real CC0 recordings from the sound-effects skill library, placed on the cue list ----------
const CUES = [
  ['whoosh', 0.00, .55], ['quickwoosh', 0.04, .45], ['swoosh', 0.14, .8], ['thump', 0.29, .9],
  ['pluck', 0.40, .7], ['pop', 0.46, .6], ['pop', 0.50, .45], ['riser', 0.55, .75, 0.93],
  ['gulp', 0.92, 1.0], ['impact', 0.93, .95], ['longwoosh', 0.97, .5], ['chop', 1.28, .8], ['plop', 1.40, .7], ['plop', 1.52, .45],
];
window.CUES = CUES;
window.buildAudio = async function (ctx) {
  const buf = {};
  for (const [k, b64] of Object.entries(SFX)) {
    const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    buf[k] = await ctx.decodeAudioData(u8.buffer);
  }
  const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  for (const [k, at, vol, endAt] of CUES) {
    const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = buf[k];
    g.gain.value = vol; src.connect(g); g.connect(master);
    if (endAt) { // risers END on the hit: play the tail so it finishes exactly at endAt
      const len = endAt - at, off = Math.max(0, buf[k].duration - len);
      g.gain.setValueAtTime(vol, at); g.gain.setValueAtTime(vol, endAt - .02); g.gain.linearRampToValueAtTime(0, endAt + .03);
      src.start(at, off); src.stop(endAt + .04);
    } else src.start(at);
  }
};

// ---------- preview UI ----------
const params = new URLSearchParams(location.search);
if (params.has('render')) { document.body.classList.add('render'); document.documentElement.style.background = 'transparent'; if (params.has('demo')) document.body.classList.add('demo'); }
else {
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); $('stage').style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; $('pp').textContent = '❚❚ Pausa';
  }
  function pause() { if (!playing) return; offset = now(); src.stop(); playing = false; $('pp').textContent = '▶ Play'; }
  function now() { return playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset; }
  $('pp').onclick = () => playing ? pause() : play();
  $('scrub').oninput = e => { const was = playing; pause(); offset = e.target.value / 1000 * VIDEO.duration; if (was) play(); };
  $('demoT').onchange = e => document.querySelectorAll('.demo').forEach(d => d.style.display = e.target.checked ? '' : 'none');
  (function loop() { const t = now(); seek(t); $('scrub').value = t / VIDEO.duration * 1000; $('tc').textContent = t.toFixed(2) + ' s'; requestAnimationFrame(loop); })();
}
seek(0);
</script>
</body>
</html>
